- main [ref=e2]:
  - generic [ref=e3]:
    - 'heading "Ciclos de vida: predictivo, iterativo, incremental, adaptativo e hibrido" [level=1] [ref=e4]'
    - paragraph [ref=e5]: "Apunte de repaso para parcial. La idea no es memorizar nombres: es reconocer que cambia cuando cambia la incertidumbre del alcance y la forma de entregar valor."
  - heading "Idea central" [level=2] [ref=e6]
  - generic [ref=e7]:
    - paragraph [ref=e8]:
      - strong [ref=e9]: "Pregunta guia:"
      - text: cuanto se sabe del producto al inicio y cuanto se necesita aprender durante el proyecto.
    - paragraph [ref=e10]: Si ya se conoce casi todo, conviene un enfoque predictivo. Si hay incertidumbre, conviene repetir ciclos, entregar partes, o combinar enfoques.
  - heading "Los cinco enfoques" [level=2] [ref=e11]
  - region "Cinco enfoques de ciclo de vida" [ref=e12]:
    - article [ref=e13]:
      - generic [ref=e14]: Predictivo
      - heading "Plan primero, cambios controlados" [level=3] [ref=e15]
      - paragraph [ref=e16]: Alcance, tiempo y costo se definen temprano. Sirve cuando los requisitos son estables.
    - article [ref=e17]:
      - generic [ref=e18]: Iterativo
      - heading "Repetir para aprender" [level=3] [ref=e19]
      - paragraph [ref=e20]: Se trabaja en ciclos repetidos para mejorar la solucion. El alcance general puede estar claro, pero el detalle se ajusta.
    - article [ref=e21]:
      - generic [ref=e22]: Incremental
      - heading "Entregar por partes" [level=3] [ref=e23]
      - paragraph [ref=e24]: Cada incremento suma funcionalidad. El producto queda completo al integrar los incrementos necesarios.
    - article [ref=e25]:
      - generic [ref=e26]: Adaptativo
      - heading "Agil y orientado al cambio" [level=3] [ref=e27]
      - paragraph [ref=e28]: El alcance detallado se define antes de cada iteracion. Prioriza respuesta al cambio e involucramiento frecuente.
    - article [ref=e29]:
      - generic [ref=e30]: Hibrido
      - heading "Mezclar segun la zona" [level=3] [ref=e31]
      - paragraph [ref=e32]: Lo conocido se gestiona predictivamente; lo incierto se gestiona adaptativamente.
