# CI del Agente 1 (issue #90): suite determinista, cobertura y linter sobre
# Implementacion/Agente1. No toca la red de Google ni usa secretos; los
# adapters remotos se ejercitan solo con transportes fake dentro de la suite.
#
# Desde el issue #95 el job levanta un servicio PostgreSQL efimero para probar
# el ciclo `up` -> `down` -> esquema original de las migraciones
# (`tests/test_migraciones_down_ciclo.py`). Es la unica pieza de la suite que
# habla con un motor real: la suite sigue siendo determinista y el resto de las
# pruebas no lo necesita. La base es desechable, con datos sinteticos y sin
# datos institucionales.
#
# Desde el issue #96 este workflow deja de filtrar por `paths` en el evento y
# pasa a decidir por job. El motivo esta explicado abajo, en el job `agente1-ci`.
#
# Este archivo vive en `.github/workflows/` del repo raiz aunque el codigo
# que prueba esta en `Implementacion/Agente1/`: GitHub Actions solo ejecuta
# workflows desde esa ubicacion. Cuando se extraiga el repositorio del
# Agente 1 (issue #80), este workflow viaja con el; los paths de abajo
# quedan relativos a la raiz del repo extraido (`src/`, `tests/`) y los
# filtros de rutas de los jobs `cambios` habra que ajustarlos alli.

name: agente1-ci

on:
  # Sin filtro `paths` a proposito (issue #96). Un filtro de workflow deja el
  # check requerido en "Expected — Waiting for status to be reported" cuando el
  # PR no toca esas rutas, y `main` queda trabada. El filtro de rutas se aplica
  # por job, mas abajo.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agente1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job liviano que SIEMPRE corre: decide si hay que ejercitar la suite.
  # No es el check requerido (ese es `agente1-ci`, mas abajo); solo publica la
  # salida `agente1` que consumen los otros dos.
  cambios:
    name: Detectar cambios del Agente 1
    runs-on: ubuntu-latest
    outputs:
      agente1: ${{ steps.filtro.outputs.agente1 }}
    steps:
      - name: Checkout con historia completa
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filtrar rutas del Agente 1
        id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CABEZA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "workflow_dispatch" ] \
             || [ -z "$BASE" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # Sin base comparable (rama nueva o corrida manual): se corre la
            # suite por las dudas. El default conservador es probar, no saltear.
            echo "agente1=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE...$CABEZA" \
             | grep -qE '^(Implementacion/Agente1/|\.github/workflows/agente1-ci\.yml$)'; then
            echo "agente1=true" >> "$GITHUB_OUTPUT"
          else
            echo "agente1=false" >> "$GITHUB_OUTPUT"
          fi

  suite:
    name: Suite, cobertura y linter del Agente 1
    needs: cambios
    if: needs.cambios.outputs.agente1 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Implementacion/Agente1
    services:
      postgres:
        # Misma version mayor que la evidencia del spike
        # (`evidencias/validacion-migraciones-postgresql-0003-2026-08-26.md`).
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # `tests/test_migraciones_down_ciclo.py` ejecuta el ciclo de migraciones
      # contra este servicio; sin la variable el caso se saltea.
      AGENTE1_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --frozen

      - name: Cliente psql para el ciclo de migraciones
        # El runner ubuntu-latest suele traer `psql`; se asegura por si cambia.
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Linter (ruff)
        run: uv run ruff check .

      - name: Suite determinista con cobertura
        run: |
          uv run pytest -q --cov=src --cov-report=term-missing
          uv run coverage report > coverage.txt

      - name: Publicar cobertura en el resumen del job
        if: always()
        run: |
          {
            echo '### Cobertura de `src/` (suite determinista, evidencia Anexo 2)'
            echo ''
            if [ -f coverage.txt ]; then
              echo '```'
              tail -n 5 coverage.txt
              echo '```'
              echo ''
              echo 'Sin umbral bloqueante: el numero es evidencia de capacidad de prueba y analizabilidad.'
            else
              echo 'La suite no completo; no hay medicion de cobertura en esta corrida.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir coverage.txt como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agente1-coverage
          path: Implementacion/Agente1/coverage.txt
          if-no-files-found: warn
          retention-days: 30

  # CHECK REQUERIDO POR LA PROTECCION DE `main` (issue #96).
  #
  # Es el unico check que la proteccion de rama exige, y por eso tiene que
  # reportar SIEMPRE: si no corre, `main` queda esperandolo para siempre.
  #
  # Por que un job aparte y no el `suite` como check requerido:
  #   * Un workflow filtrado por `paths` que no matchea NO se ejecuta y su check
  #     queda en "Expected — Waiting for status to be reported" (documentado por
  #     GitHub en "Handling skipped but required checks"). Un PR que solo toca
  #     documentacion quedaria trabado. Es exactamente la trampa del issue #96.
  #   * Un job salteado por un `if:` reporta "Success" y no traba; pero un job
  #     que depende de otro que fallo se saltea y podria no trabar (docs: "Use
  #     `always()` with `needs` for required checks that depend on other jobs").
  #     Este job usa `if: always()` y evalua a mano el resultado de `suite`, asi
  #     que no depende de esa sutileza.
  #
  # El nombre del job es el nombre del check requerido: `agente1-ci`.
  agente1-ci:
    name: agente1-ci
    needs:
      - cambios
      - suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluar el resultado del Agente 1
        run: |
          set -euo pipefail
          echo "deteccion=${{ needs.cambios.result }} suite=${{ needs.suite.result }}"
          if [ "${{ needs.cambios.result }}" != "success" ]; then
            echo "::error::La deteccion de cambios no completo; no se puede acreditar el check."
            exit 1
          fi
          case "${{ needs.suite.result }}" in
            success)
              echo "Conforme: la suite del Agente 1 paso."
              ;;
            skipped)
              echo "Conforme: el cambio no toca el Agente 1; no habia suite que correr."
              ;;
            *)
              echo "::error::La suite del Agente 1 no paso (resultado: ${{ needs.suite.result }})."
              exit 1
              ;;
          esac
