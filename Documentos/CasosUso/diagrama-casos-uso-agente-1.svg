<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama funcional de casos de uso del Agente 1 Extension Bot</title>
  <desc id="desc">Actores humanos y sistemas externos conectados a los casos de uso funcionales del Agente 1, con controles transversales de validacion humana y trazabilidad.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>

    <symbol id="icon-person" viewBox="-24 -24 48 48">
      <circle cx="0" cy="-8" r="8" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M -16 20 C -14 7 -8 2 0 2 C 8 2 14 7 16 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-system" viewBox="-24 -24 48 48">
      <rect x="-16" y="-12" width="32" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M -10 13 H 10 M 0 6 V 13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-robot" viewBox="-24 -24 48 48">
      <path d="M 0 -20 V -13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-22" r="3" fill="currentColor"/>
      <rect x="-17" y="-12" width="34" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="-7" cy="0" r="3" fill="currentColor"/>
      <circle cx="7" cy="0" r="3" fill="currentColor"/>
      <path d="M -7 9 H 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-tools" viewBox="-24 -24 48 48">
      <path d="M -14 14 L 8 -8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M 8 -8 L 15 -15 M 8 -8 L 15 -5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-15" cy="15" r="5" fill="none" stroke="currentColor" stroke-width="3"/>
    </symbol>
  </defs>

  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; }
    .group-title { font: 700 16px Arial, sans-serif; fill: #334155; }
    .card-title { font: 700 15px Arial, sans-serif; fill: #111827; }
    .card-subtitle { font: 400 13px Arial, sans-serif; fill: #334155; }
    .case-id { font: 700 15px Arial, sans-serif; fill: #111827; text-anchor: middle; }
    .case-text { font: 400 15px Arial, sans-serif; fill: #111827; text-anchor: middle; }
    .legend { font: 400 13px Arial, sans-serif; fill: #334155; }
    .label { font: 700 12px Arial, sans-serif; fill: #475569; text-anchor: middle; }
    .actor-card { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .system-card { fill: #ecfdf5; stroke: #059669; stroke-width: 1.4; }
    .boundary { fill: #fffdf3; stroke: #d4a017; stroke-width: 1.6; }
    .usecase { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .control { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .line { fill: none; stroke: #475569; stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
    .line-light { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-linecap: square; stroke-linejoin: miter; }
    .dashed { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 7 5; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
    .label-bg { fill: #fffdf3; stroke: none; }
  </style>

  <rect width="1600" height="1000" fill="#ffffff"/>

  <text x="70" y="54" class="title">Diagrama funcional de casos de uso — Agente 1 Extension Bot</text>
  <text x="70" y="82" class="subtitle">Proyecto Centenario (P100) · Juan Ignacio Goñe · Casos de uso de implementación</text>

  <g transform="translate(70 112)">
    <rect x="0" y="0" width="22" height="14" class="actor-card" rx="3"/>
    <text x="30" y="12" class="legend">Actor humano</text>
    <rect x="150" y="0" width="22" height="14" class="system-card" rx="3"/>
    <text x="180" y="12" class="legend">Sistema / agente externo</text>
    <ellipse cx="398" cy="7" rx="18" ry="9" class="usecase"/>
    <text x="426" y="12" class="legend">Caso de uso funcional</text>
    <ellipse cx="610" cy="7" rx="18" ry="9" class="control"/>
    <text x="638" y="12" class="legend">Control transversal</text>
  </g>

  <rect x="410" y="145" width="760" height="740" rx="10" class="boundary"/>
  <text x="790" y="178" class="group-title" text-anchor="middle">Límite del sistema: Agente 1 — Extension Bot</text>
  <text x="790" y="202" class="subtitle" text-anchor="middle">Agente de comunicación institucional · Proceso 4</text>

  <text x="190" y="160" class="group-title" text-anchor="middle">Entradas</text>
  <text x="1330" y="160" class="group-title" text-anchor="middle">Validación y soporte</text>

  <!-- Actores y sistemas de entrada -->
  <g color="#2563eb">
    <rect x="70" y="205" width="270" height="80" rx="8" class="actor-card"/>
    <use href="#icon-person" x="92" y="225" width="42" height="42"/>
    <text x="148" y="238" class="card-title">Personal SEU</text>
    <text x="148" y="260" class="card-subtitle">Usuario operativo interno</text>
  </g>

  <g color="#059669">
    <rect x="70" y="370" width="270" height="80" rx="8" class="system-card"/>
    <use href="#icon-system" x="92" y="390" width="42" height="42"/>
    <text x="148" y="403" class="card-title">Google Workspace</text>
    <text x="148" y="425" class="card-subtitle">Sheets · Docs · Gmail · Drive</text>
  </g>

  <g color="#059669">
    <rect x="70" y="535" width="270" height="80" rx="8" class="system-card"/>
    <use href="#icon-robot" x="92" y="555" width="42" height="42"/>
    <text x="148" y="568" class="card-title">Agentes A2-A5</text>
    <text x="148" y="590" class="card-subtitle">Insumos para comunicación</text>
  </g>

  <!-- Validadores y soporte -->
  <g color="#2563eb">
    <rect x="1260" y="205" width="270" height="80" rx="8" class="actor-card"/>
    <use href="#icon-person" x="1282" y="225" width="42" height="42"/>
    <text x="1338" y="238" class="card-title">Coordinador de Extensión</text>
    <text x="1338" y="260" class="card-subtitle">Accountable del Proceso 4</text>
  </g>

  <g color="#2563eb">
    <rect x="1260" y="320" width="270" height="80" rx="8" class="actor-card"/>
    <use href="#icon-person" x="1282" y="340" width="42" height="42"/>
    <text x="1338" y="353" class="card-title">Resp. Gestión del</text>
    <text x="1338" y="373" class="card-title">Conocimiento</text>
  </g>

  <g color="#2563eb">
    <rect x="1260" y="435" width="270" height="80" rx="8" class="actor-card"/>
    <use href="#icon-person" x="1282" y="455" width="42" height="42"/>
    <text x="1338" y="468" class="card-title">Resp. Redes Sociales</text>
    <text x="1338" y="490" class="card-subtitle">Validación por canal</text>
  </g>

  <g color="#2563eb">
    <rect x="1260" y="660" width="270" height="80" rx="8" class="actor-card"/>
    <use href="#icon-tools" x="1282" y="680" width="42" height="42"/>
    <text x="1338" y="693" class="card-title">Resp. Técnico</text>
    <text x="1338" y="713" class="card-title">Sistemas / IA</text>
  </g>

  <!-- Casos de uso funcionales -->
  <ellipse cx="650" cy="260" rx="160" ry="48" class="usecase"/>
  <text x="650" y="250" class="case-id">CU-A1-01</text>
  <text x="650" y="273" class="case-text">Generar gacetilla</text>

  <ellipse cx="650" cy="375" rx="160" ry="48" class="usecase"/>
  <text x="650" y="365" class="case-id">CU-A1-02</text>
  <text x="650" y="388" class="case-text">Generar post RRSS</text>

  <ellipse cx="650" cy="490" rx="160" ry="48" class="usecase"/>
  <text x="650" y="480" class="case-id">CU-A1-03</text>
  <text x="650" y="503" class="case-text">Enviar confirmación</text>

  <ellipse cx="650" cy="605" rx="160" ry="48" class="usecase"/>
  <text x="650" y="595" class="case-id">CU-A1-04</text>
  <text x="650" y="618" class="case-text">Interacción interna LN</text>

  <ellipse cx="650" cy="720" rx="160" ry="48" class="usecase"/>
  <text x="650" y="710" class="case-id">CU-A1-05</text>
  <text x="650" y="733" class="case-text">Generar certificado</text>

  <!-- Controles transversales -->
  <ellipse cx="965" cy="350" rx="150" ry="55" class="control"/>
  <text x="965" y="339" class="case-id">CU-A1-06</text>
  <text x="965" y="363" class="case-text">Validar contenido</text>

  <ellipse cx="965" cy="665" rx="150" ry="55" class="control"/>
  <text x="965" y="654" class="case-id">CU-A1-07</text>
  <text x="965" y="678" class="case-text">Registrar trazabilidad</text>

  <!-- Asociaciones desde entradas -->
  <polyline points="340,245 385,245 385,260 490,260" class="line"/>
  <polyline points="340,245 385,245 385,375 490,375" class="line-light"/>
  <polyline points="340,245 385,245 385,490 490,490" class="line-light"/>
  <polyline points="340,245 385,245 385,605 490,605" class="line-light"/>
  <polyline points="340,245 385,245 385,720 490,720" class="line-light"/>

  <polyline points="340,410 370,410 370,260 490,260" class="line-light"/>
  <polyline points="340,410 370,410 370,375 490,375" class="line-light"/>
  <polyline points="340,410 370,410 370,490 490,490" class="line-light"/>
  <polyline points="340,410 370,410 370,605 490,605" class="line-light"/>
  <polyline points="340,410 370,410 370,720 490,720" class="line-light"/>

  <polyline points="340,575 355,575 355,260 490,260" class="line-light"/>
  <polyline points="340,575 355,575 355,375 490,375" class="line-light"/>

  <!-- Includes / registros transversales -->
  <polyline points="810,260 845,260 845,350 815,350" class="dashed"/>
  <rect x="832" y="300" width="56" height="18" rx="4" class="label-bg"/>
  <text x="860" y="314" class="label">incluye</text>

  <polyline points="810,375 845,375 845,350 815,350" class="dashed"/>
  <polyline points="810,720 860,720 860,350 815,350" class="dashed"/>

  <polyline points="810,260 885,260 885,665 815,665" class="dashed"/>
  <polyline points="810,375 895,375 895,665 815,665" class="dashed"/>
  <polyline points="810,490 905,490 905,665 815,665" class="dashed"/>
  <rect x="890" y="570" width="62" height="18" rx="4" class="label-bg"/>
  <text x="921" y="584" class="label">registra</text>
  <polyline points="810,605 915,605 915,665 815,665" class="dashed"/>
  <polyline points="810,720 925,720 925,665 815,665" class="dashed"/>

  <!-- Asociaciones hacia validadores -->
  <polyline points="1115,350 1230,350 1230,245 1260,245" class="line"/>
  <polyline points="1115,350 1230,350 1230,360 1260,360" class="line"/>
  <polyline points="1115,350 1230,350 1230,475 1260,475" class="line"/>
  <polyline points="1115,665 1230,665 1230,700 1260,700" class="line"/>
</svg>
