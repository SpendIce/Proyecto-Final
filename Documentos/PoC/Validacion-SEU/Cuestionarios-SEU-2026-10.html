<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuestionarios SEU</title>
<style>
  :root{
    --bg:#f8fafc; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --teal:#0f766e; --teal-soft:#f0fdfa; --amber:#d97706; --amber-soft:#fffbeb;
    --green:#15803d; --green-soft:#f0fdf4; --red:#dc2626; --slate-soft:#f1f5f9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220; --panel:#111a2b; --ink:#e2e8f0; --muted:#94a3b8; --line:#1f2a3d;
      --teal:#2dd4bf; --teal-soft:#0f2a2a; --amber:#fbbf24; --amber-soft:#2a2210;
      --green:#4ade80; --green-soft:#0f2416; --red:#f87171; --slate-soft:#18233a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1220; --panel:#111a2b; --ink:#e2e8f0; --muted:#94a3b8; --line:#1f2a3d;
    --teal:#2dd4bf; --teal-soft:#0f2a2a; --amber:#fbbf24; --amber-soft:#2a2210;
    --green:#4ade80; --green-soft:#0f2416; --red:#f87171; --slate-soft:#18233a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
  header{padding:18px 16px 0;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .wrap{max-width:920px;margin:0 auto}
  h1{margin:0 0 2px;font-size:19px}
  .sub{color:var(--muted);font-size:13px}
  nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
  nav button{border:0;background:none;padding:9px 12px;font:inherit;font-size:14px;color:var(--muted);
    border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  nav button.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
  nav .count{font-size:11.5px;background:var(--slate-soft);border-radius:10px;padding:1px 7px;margin-left:6px}
  main{padding:16px}
  .intro{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .intro h2{margin:0 0 4px;font-size:17px}
  .intro p{margin:6px 0;font-size:14px}
  .meta{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}
  .meta label{font-size:12px;color:var(--muted);display:block}
  input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
  input:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:transparent}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
  .progress{flex:1 1 220px;height:8px;background:var(--slate-soft);border-radius:6px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--teal);width:0}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--teal);color:var(--teal)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .toggle{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .saved{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
  section.theme{margin:18px 0 6px}
  section.theme>h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px}
  .q{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .q[data-st="respondida"]{border-left-color:var(--green)}
  .q[data-st="parcial"],.q[data-st="nosabe"]{border-left-color:var(--amber)}
  .q[data-st="derivada"]{border-left-color:var(--teal)}
  .qh{display:flex;gap:10px;align-items:flex-start}
  .qid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;color:var(--muted);padding-top:3px;white-space:nowrap}
  .qt{font-weight:600;font-size:15.5px}
  .why{font-size:13px;color:var(--muted);margin:4px 0 0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
  .chip{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--slate-soft);color:var(--muted)}
  .chip.sup{background:var(--amber-soft);color:var(--amber)}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
  .opt{border:1px dashed var(--line);background:none;color:var(--ink);border-radius:16px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
  .opt:hover{border-color:var(--teal);color:var(--teal)}
  .opt.on{border-style:solid;border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:600}
  .q textarea{margin-top:10px;min-height:58px;resize:vertical}
  .status{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center}
  .status button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;font:inherit;font-size:12.5px;cursor:pointer}
  .status button.on{color:#fff;border-color:transparent}
  .status button.on[data-v="respondida"]{background:var(--green)}
  .status button.on[data-v="parcial"],.status button.on[data-v="nosabe"]{background:var(--amber)}
  .status button.on[data-v="derivada"]{background:var(--teal)}
  .status button.on[data-v="pendiente"]{background:var(--muted)}
  .status input{flex:1 1 180px;width:auto;padding:4px 8px;font-size:13px}
  .hide{display:none!important}
  .closing{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:18px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:24px 16px}
  @media (max-width:640px){ .meta{grid-template-columns:1fr} .qt{font-size:15px} }
  @media print{
    header{position:static} nav,.bar .btn,.toggle,.opts,.status button:not(.on){display:none!important}
    .q{break-inside:avoid} body{background:#fff}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Cuestionarios para la SEU — Agente 1</h1>
    <div class="sub">Octubre 2026 · los completa Juani en presencia de cada persona · se guardan solos en este navegador</div>
    <nav id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer>Las respuestas se guardan localmente. Para que cuenten como evidencia, descargá el acta (.md) y versionala en <code>Documentos/PoC/Validacion-SEU/</code>.</footer>

<script>
const CONTEXTO_COMUN = "El Agente 1 prepara borradores de gacetillas, posts, confirmaciones de inscripción, avisos de pago y certificados; nada sale sin la aprobación de la SEU. El 18/11 se presenta funcionando en la mesa final, ante el profesor de la materia, la Dirección de Carrera y la SEU. Estas preguntas son lo que el equipo técnico no puede decidir solo.";

const PERSONAS = [
{

    ]},
  ]
},
{
  id:"DC", nombre:"Departamento Cursos Complementarios", rol:"Aux de Curso · inscripciones, pagos y padrón",
  proposito:"Entender el circuito real de inscripción y pago para que el agente cuente comprobantes y prepare recordatorios sin equivocarse. El agente no cobra ni verifica pagos.",
  temas:[
    {titulo:"Inscripción y verificación del pago", qs:[
      {id:"A1", t:"¿Qué convierte a un preinscripto en inscripto?",
       sup:"Supuesto actual: la verificación de la Fundación Savio.",
       opts:["Mandar el comprobante","Verificación de la Fundación","Cambio en el SIU"]},
      {id:"A2", t:"¿Cómo les avisa la Fundación Savio que verificó un ingreso?",

      {id:"A3", t:"¿Registran los pagos en SIU Guaraní Extensión?",
       why:"Si el SIU tiene un estado de pago, el agente lo lee de ahí y no hay que cargarlo a mano.",

      {id:"A4", t:"¿Qué pasa con quien no pagó al empezar el curso?",
       why:"Solo para saber dónde termina el aviso. El agente no decide bajas."},
      {id:"A5", t:"Quien responde con el comprobante, ¿tiene que recibir una respuesta automática de «recibido»?",

       opts:["Sí, estable","No, varía","Se puede fijar"]},

    {titulo:"Correo del Departamento", qs:[

const ESTADOS = [["pendiente","Pendiente"],["respondida","Respondida"],["parcial","Parcial"],["nosabe","No sabe"],["derivada","Derivar a…"]];
const KEY = "cuestionarios-seu-2026-10";
let datos = {}; let tab = PERSONAS[0].id; let soloPend = false;

function cargar(){ try{ datos = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ datos = {}; } }
let tGuardar;
function guardar(){
  clearTimeout(tGuardar);
  tGuardar = setTimeout(()=>{
    const el = document.getElementById("saved");
    try{ localStorage.setItem(KEY, JSON.stringify(datos)); if(el) el.textContent = "Guardado " + new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}); }
    catch(e){ if(el) el.textContent = "Sin guardado local: exportá"; }
  }, 250);
}
const P = id => (datos[id] ||= {meta:{fecha:"",presentes:""}, r:{}, extra:""});
const R = (pid,qid) => (P(pid).r[qid] ||= {estado:"pendiente", texto:"", opt:"", deriva:""});
const todas = p => p.temas.flatMap(t => t.qs);
const avance = p => { const qs = todas(p); const n = qs.filter(q => R(p.id,q.id).estado !== "pendiente").length; return [n, qs.length]; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderTabs(){
  document.getElementById("tabs").innerHTML = PERSONAS.map(p => {
    const [n,t] = avance(p);
    return `<button class="${p.id===tab?"on":""}" data-tab="${p.id}">${esc(p.nombre)}<span class="count">${n}/${t}</span></button>`;
  }).join("");
}

function render(){
  renderTabs();
  const p = PERSONAS.find(x => x.id === tab), d = P(p.id), [n,t] = avance(p);
  let h = `<div class="intro"><h2>${esc(p.nombre)}</h2><div class="sub">${esc(p.rol)}</div>
    <p><b>Para qué:</b> ${esc(p.proposito)}</p><p class="sub">${esc(CONTEXTO_COMUN)}</p>
    <p class="sub">Las respuestas parciales y los «no sé» también sirven: mejor marcarlos que saltear la pregunta.</p>
    <div class="meta"><div><label>Fecha de la reunión</label><input type="date" data-meta="fecha" value="${esc(d.meta.fecha)}"></div>
    <div><label>Presentes</label><input data-meta="presentes" placeholder="Nombres y roles" value="${esc(d.meta.presentes)}"></div></div></div>
    <div class="bar"><div class="progress" title="${n} de ${t}"><i style="width:${t?100*n/t:0}%"></i></div>
    <label class="toggle"><input type="checkbox" id="solo" ${soloPend?"checked":""} style="width:auto"> Solo pendientes</label>
    <button class="btn primary" data-act="md">Descargar acta (.md)</button>
    <button class="btn" data-act="json">Exportar todo (.json)</button>
    <button class="btn" data-act="import">Importar</button>
    <span class="saved" id="saved"></span></div>`;
  for(const tema of p.temas){
    h += `<section class="theme"><h3>${esc(tema.titulo)}</h3>`;
    for(const q of tema.qs){
      const r = R(p.id,q.id), oculto = soloPend && r.estado !== "pendiente";
      h += `<div class="q ${oculto?"hide":""}" data-st="${r.estado}" data-q="${q.id}">
        <div class="qh"><span class="qid">${p.id}-${q.id}</span><div><div class="qt">${esc(q.t)}</div>
        ${q.why?`<p class="why">${esc(q.why)}</p>`:""}
        ${q.sup?`<div class="chips"><span class="chip sup">${esc(q.sup)}</span></div>`:""}</div></div>
        ${q.opts?`<div class="opts">${q.opts.map(o=>`<button class="opt ${r.opt===o?"on":""}" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>`:""}
        <textarea data-txt placeholder="Respuesta, en sus palabras">${esc(r.texto)}</textarea>
        <div class="status">${ESTADOS.map(([v,l])=>`<button data-v="${v}" class="${r.estado===v?"on":""}">${l}</button>`).join("")}
        <input data-deriva class="${r.estado==="derivada"?"":"hide"}" placeholder="¿A quién?" value="${esc(r.deriva)}"></div></div>`;
    }
    h += `</section>`;
  }
  h += `<div class="closing"><b>¿Algo más?</b><p class="sub" style="margin:4px 0 8px">¿Hay algo que no preguntamos y deberíamos saber?</p>
    <textarea data-extra placeholder="Notas libres">${esc(d.extra)}</textarea></div>`;
  document.getElementById("main").innerHTML = h;
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if(!b) return; tab = b.dataset.tab; render(); scrollTo(0,0);
});
const main = document.getElementById("main");
main.addEventListener("click", e => {
  const card = e.target.closest(".q"), p = PERSONAS.find(x => x.id === tab);
  if(e.target.matches("[data-act=md]")) return descargar(`acta-${p.id}-${hoy()}.md`, acta(p), "text/markdown");
  if(e.target.matches("[data-act=json]")) return descargar(`cuestionarios-seu-${hoy()}.json`, JSON.stringify(datos,null,2), "application/json");
  if(e.target.matches("[data-act=import]")) return importar();
  if(!card) return;
  const r = R(tab, card.dataset.q);
  if(e.target.matches("[data-opt]")){
    r.opt = r.opt === e.target.dataset.opt ? "" : e.target.dataset.opt;
    if(r.opt && r.estado === "pendiente") r.estado = "respondida";
    guardar(); render(); return;
  }
  if(e.target.matches(".status button")){ r.estado = e.target.dataset.v; guardar(); render(); }
});
main.addEventListener("input", e => {
  const card = e.target.closest(".q");
  if(e.target.matches("[data-meta]")) P(tab).meta[e.target.dataset.meta] = e.target.value;
  else if(e.target.matches("[data-extra]")) P(tab).extra = e.target.value;
  else if(card && e.target.matches("[data-txt]")){
    const r = R(tab, card.dataset.q); r.texto = e.target.value;
    if(r.texto.trim() && r.estado === "pendiente"){ r.estado = "respondida"; card.dataset.st = "respondida";
      card.querySelectorAll(".status button").forEach(b => b.classList.toggle("on", b.dataset.v === "respondida")); renderTabs(); }
  }
  else if(card && e.target.matches("[data-deriva]")) R(tab, card.dataset.q).deriva = e.target.value;
  guardar();
});
main.addEventListener("change", e => { if(e.target.id === "solo"){ soloPend = e.target.checked; render(); } });

function hoy(){ return new Date().toISOString().slice(0,10); }
function acta(p){
  const d = P(p.id), [n,t] = avance(p), et = Object.fromEntries(ESTADOS);
  let s = `# Acta de cuestionario — ${p.nombre}\n\n- **Rol:** ${p.rol}\n- **Fecha de la reunión:** ${d.meta.fecha || "(sin fecha)"}\n- **Presentes:** ${d.meta.presentes || "(sin registrar)"}\n- **Registró:** Juani, en presencia de la persona consultada\n- **Avance:** ${n} de ${t} preguntas con respuesta o estado\n\n> Respuestas registradas durante la reunión. Valen como \`CONFIRMADO_SEU\` por acta de reunión (criterio del 22/09). Lo marcado como parcial, «no sabe» o derivado sigue abierto.\n`;
  for(const tema of p.temas){
    s += `\n## ${tema.titulo}\n`;
    for(const q of tema.qs){
      const r = R(p.id,q.id);
      s += `\n### ${p.id}-${q.id} — ${q.t}\n\n- **Estado:** ${et[r.estado]}${r.estado==="derivada"&&r.deriva?` → ${r.deriva}`:""}\n`;
      if(q.sup) s += `- **Supuesto previo:** ${q.sup.replace(/^Supuesto actual:\s*/,"")}\n`;
      if(r.opt) s += `- **Opción elegida:** ${r.opt}\n`;
      s += `- **Respuesta:** ${r.texto.trim() ? r.texto.trim().replace(/\n/g,"\n  ") : "—"}\n`;
    }
  }
  s += `\n## Otros comentarios\n\n${d.extra.trim() || "—"}\n`;
  return s;
}
function descargar(nombre, contenido, tipo){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([contenido], {type:tipo+";charset=utf-8"}));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importar(){
  const i = document.createElement("input"); i.type = "file"; i.accept = "application/json";
  i.onchange = () => { const f = i.files[0]; if(!f) return;
    f.text().then(t => { try{ datos = JSON.parse(t); guardar(); render(); }catch(e){ document.getElementById("saved").textContent = "Archivo inválido"; } }); };
  i.click();
}
cargar(); render();
</script>
</body>
</html>
