fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.872" x="1859.2135" y="1447.0822">26</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.3411" x="1932.7376" y="1438.2292">Registrar rechazo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.6452" x="1878.0855" y="1455.9352">por dato, tono, alcance o seguridad</text></g><g class="message" data-entity-1="part5" data-entity-2="part11" id="msg27"><polygon fill="#1F2937" points="2660.9798,1507.1563,2670.9798,1511.1563,2660.9798,1515.1563,2664.9798,1511.1563" style="stroke:#1F2937;stroke-width:1;"/><line style="stroke:#1F2937;stroke-width:1;" x1="1459.4338" x2="2666.9798" y1="1511.1563" y2="1511.1563"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.872" x="1969.7747" y="1496.4942">27</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.9921" x="1988.6467" y="1487.6412">Guardar estado RECHAZADA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.4551" x="2003.9152" y="1505.3473">y bloquear salida oficial</text></g><g class="message" data-entity-1="part5" data-entity-2="part1" id="msg28"><polygon fill="#1F2937" points="158.5896,1538.8623,148.5896,1542.8623,158.5896,1546.8623,154.5896,1542.8623" style="stroke:#1F2937;stroke-width:1;"/><line style="stroke:#1F2937;stroke-width:1;stroke-dasharray:2,2;" x1="152.5896" x2="1458.4338" y1="1542.8623" y2="1542.8623"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.872" x="673.2861" y="1537.0533">28</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.5792" x="692.1581" y="1537.0533">Informar rechazo y pasos de correccion</text></g><path d="M1395,1569.8623 L1395,1614.8623 L2223,1614.8623 L2223,1579.8623 L2213,1569.8623 L1395,1569.8623" fill="#FFFBEB" style="stroke:#92400E;stroke-width:0.5;"/><path d="M2213,1569.8623 L2213,1579.8623 L2223,1579.8623 L2213,1569.8623" fill="#FFFBEB" style="stroke:#92400E;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.4553" x="1652.0331" y="1588.7593">El LLM no publica, envia, aprueba ni emite.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.5913" x="1652.0331" y="1606.4653">Su salida es un borrador sujeto a control humano.</text><path d="M290,1625.2743 L290,1670.2743 L1534,1670.2743 L1534,1635.2743 L1524,1625.2743 L290,1625.2743" fill="#FFFBEB" style="stroke:#92400E;stroke-width:0.5;"/><path d="M1524,1625.2743 L1524,1635.2743 L1534,1635.2743 L1524,1625.2743" fill="#FFFBEB" style="stroke:#92400E;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.6763" x="701.7896" y="1644.1713">A1 funciona como hub de comunicacion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.1263" x="701.7896" y="1661.8773">Recibe insumos de A2-A5, pero no orquesta el sistema multiagente.</text><path d="M2235,1680.6863 L2235,1725.6863 L2746,1725.6863 L2746,1690.6863 L2736,1680.6863 L2235,1680.6863" fill="#FFFBEB" style="stroke:#92400E;stroke-width:0.5;"/><path d="M2736,1680.6863 L2736,1690.6863 L2746,1690.6863 L2736,1680.6863" fill="#FFFBEB" style="stroke:#92400E;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.7313" x="2295.8709" y="1699.5834">Para certificados, la generacion del PDF no equivale a emision.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.2873" x="2295.8709" y="1717.2894">La emision requiere aprobacion humana y registro.</text><rect fill="#DDDDDD" height="67.2038" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="329.9548" x="2441.1587" y="1851.2342"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="276.9609" x="2446.1587" y="1871.2001">Flujo nominal del A1 dentro del Proceso 4.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="269.569" x="2446.1587" y="1890.2681">A1 genera borradores comunicacionales.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="319.9548" x="2446.1587" y="1909.336">La aprobacion humana es condicion bloqueante.</text><?plantuml-src bLVBSjku4jtpAxfyboCdbksylBXLr8EswogMHffaSKjLBeY29IGGm058nSdNpsaGf2ZRuvfPMIOQ_Jnzkb6gKaiQAR5nOYTeBSdBl98cLu9EATr8Kqhgq_YnbCOhQsXWooJntvKf16wGtugr_Q7CXXw4zh9x8lzaFVApz5viPAhLnb3E-bn7oabVMECRgO7KzaVgdFr1fQkwwcR2bIfNXJ3bJApNRF7yh7C-i8_DztxtUr0sjDew-ay_E_zqyQ5pE54FSgAC75YtbYvAlHzyEFzuzfAKoBzldAtCEafcdx8q6xpiv97AYm-N_NVzln5ygdMSPU-ph1j2NbhtkhvQv9b_5zbbzhuZDXAbM0alNrVMIZtpR9YDidSToJjR7klwT7vvTZP-Al7ChomRZ0T9eYNmjIQdDjio8SfqzSsIiJjbX0OKDQLz_36bi-6_cREvz9Oktq0OHxWidQ2LTGuW198ejxlAg5paGAhGqhFWH90ed5s5ZxIjTi882h9chSAtbRQ0AaeXtoJmf_OgIGJdb4w--4euPKanSesbnVZBqYnaxcI9xuBUqj0Y1V0PFk2_aGqWFo7XATvDYaEvwIGzFqtVBOqoljfPJxPel0rNwfRpnrUkhTsWJJFhTXuc5bifIxyqgugl8mUbsjjmkpvvOgyeS90xLPHBv59jDj9HANCaghx40lNvyKMk6zSdxIzD9doPpcw3VFnzBFnLQBKEAG2729qBjFxI_AIrA14aIgeGRBZUIexuw5ZBH9ZDS2kKMHhKR5UKdlRICV7WGdsz5Jc-ETMQ2KpRNEYbcKm-1-7wwx4a2iH973crb_HsQQvtGcbyc8soEeV1lwRyXxW2T6BzvzV3PuMVpnUBum1lmera7Vk9JkPoetmDP_2R-2LMAeW2KA5mP6bcVRbnSl7xf8xMRZoWM9NMLBiLg3DPsKSwkJMGGIlyHBku7Upz2l0-GMzz12SDWVi6jwV_ZQYueg5m6n4hOibRZPoKWWebVucbGS1gpzxqW7NFU62LFN0salU0hbfRt4BRO1IejOK9MvIqa3k9a2IT8mNS8nWaeQjc_RCpo523wAuZQM5TAGmrFT06WI8lJNfEMwJ9ehjwb5wGt4E1zVXz6UP51OE2UxtGyXkBl0ES7qjBqZY5JivhxxY9APfaumUONz4ug2JDPfRcGMb1ff9xA7k0AvNcpFL81cIqcQhMj1CEUH3CFwqsrXrR0ehD7fnmk72831bMw_lsf4T5JMVtgsBN0xZkrm