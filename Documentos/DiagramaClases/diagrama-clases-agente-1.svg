nte: String, contenido: Text): InsumoAgenteExterno</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="323.9588" x="4660.82" y="243.4338">+registrarOrigen(insumo: InsumoAgenteExterno)</text></g><g class="entity" data-qualified-name="GMN90" data-source-line="351" id="ent0091"><path d="M6157.28,792.4479 L6157.28,873.272 L6536.7292,873.272 L6536.7292,802.4479 L6526.7292,792.4479 L6157.28,792.4479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M6526.7292,792.4479 L6526.7292,802.4479 L6536.7292,802.4479 L6526.7292,792.4479" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.6441" x="6163.28" y="811.3449">Reglas de alcance:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.4512" x="6163.28" y="829.0509">- A1 no hace scraping, analitica ni dashboards.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.6703" x="6163.28" y="846.757">- A1 no atiende masivamente al publico general.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.4492" x="6163.28" y="864.463">- A1 recibe insumos de A2-A5, pero no orquesta el sistema.</text></g><g class="entity" data-qualified-name="GMN93" data-source-line="358" id="ent0094"><path d="M5600.7,1426.0279 L5600.7,1506.852 L5981.3063,1506.852 L5981.3063,1436.0279 L5971.3063,1426.0279 L5600.7,1426.0279" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M5971.3063,1426.0279 L5971.3063,1436.0279 L5981.3063,1436.0279 L5971.3063,1426.0279" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.5143" x="5606.7" y="1444.9249">Toda pieza institucional queda como borrador o pendiente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.6543" x="5606.7" y="1462.6309">hasta validacion humana cuando sea publica, critica</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.6063" x="5606.7" y="1480.337">o documental. Las confirmaciones pueden enviarse si usan</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.6772" x="5606.7" y="1498.043">plantilla ya aprobada y datos de inscripcion validos.</text></g><g class="entity" data-qualified-name="GMN96" data-source-line="365" id="ent0097"><path d="M5167.88,170.1979 L5167.88,233.316 L5478.1172,233.316 L5478.1172,180.1979 L5468.1172,170.1979 L5167.88,170.1979" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M5468.1172,170.1979 L5468.1172,180.1979 L5478.1172,180.1979 L5468.1172,170.1979" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.5012" x="5173.88" y="189.0949">Google Sheets funciona como bus de datos.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.2372" x="5173.88" y="206.8009">Google Docs, Drive y Gmail materializan salidas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.4542" x="5173.88" y="224.507">y evidencias del Proceso 4 / Proceso 5.</text></g><g class="entity" data-qualified-name="GMN99" data-source-line="371" id="ent0100"><path d="M5597.09,1680.8479 L5597.09,1761.672 L5934.9002,1761.672 L5934.9002,1690.8479 L5924.9002,1680.8479 L5597.09,1680.8479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M5924.9002,1680.8479 L5924.9002,1690.8479 L5934.9002,1690.8479 L5924.9002,1680.8479" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.9512" x="5603.09" y="1699.7449">El registro debe permitir reconstruir:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.9962" x="5603.09" y="1717.4509">solicitud, fuente, salida, estado, validador,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8102" x="5603.09" y="1735.157">observaciones y evidencia, sin exponer credenciales</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.8282" x="5603.09" y="1752.863">ni datos sensibles innecesarios.</text></g><!--link UsuarioInterno to SolicitudGeneracion--><g class="link" data-entity-1="ent0009" data-entity-2="ent0012" data-link-type="dependency" data-source-line="295" id="lnk42"><path codeLine="295" d="M5646.03,1085.0979 C5626.7,1067.1079 5604.47,1049.7879 5581,1037.9079 C5265.38,878.1079 4848.3567,842.5371 4628.8867,835.2471" fill="none" id="UsuarioInterno-to-SolicitudGeneracion" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="4622.89,835.0479,4631.7522,839.3445,4627.8872,835.2139,4632.0178,831.3489,4622.89,835.0479" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.2101" x="5499.75" y="1003.8049">crea / solicita</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.436" x="5632.2385" y="1073.7025">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.567" x="4629.8728" y="830.7151">0..*</text></g><!--link UsuarioInterno to ValidacionHumana--><g class="link" data-entity-1="ent0009" data-entity-2="ent0024" data-link-type="dependency" data-source-line="296" id="lnk43"><path codeLine="296" d="M5713.18,1242.5279 C5708.99,1275.8379 5698.65,1312.9979 5675,1338.9979 C5646.06,1370.8179 5620.82,1348.5279 5583,1368.9979 C5577.24,13