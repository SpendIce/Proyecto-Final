# Stack del Agente 1 en el servidor de la facultad (#143, ADR 0013).
#
# En `main` este archivo es la plantilla: la imagen apunta a `:local`. Al cortar
# una versión, el CI publica la imagen en ghcr.io y escribe este mismo archivo
# en la rama `deploy` con la imagen fijada por digest. Portainer sigue esa rama.
#
# Aislamiento (Q1 y Q4 de #124):
# - Ollama vive en la red `modelo`, interna: sin salida a internet.
# - Los contenedores del agente corren como el uid del dueño de la clave, sin
#   capacidades, con el sistema de archivos de sólo lectura y sin el socket de
#   Docker. Llegan a Ollama por el relay de loopback del entrypoint.
# - La consola se publica sólo en 127.0.0.1 del host y se abre por túnel SSH.
#
# Las rutas del host tienen defaults para `labredesfie` y se pueden cambiar con
# variables de entorno del stack.

name: agente1

x-endurecido: &endurecido
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-agente1: &agente1
  <<: *endurecido
  # `tmp/` y `salida/` son los directorios por defecto de los scripts cuando
  # se corren sin `--directorio`: escribibles pero efímeros. Lo durable va a
  # `/state` (el estado montado del host).
  tmpfs:
    - /tmp
    - /srv/p100/Implementacion/Agente1/tmp:mode=1777
    - /srv/p100/Implementacion/Agente1/salida:mode=1777
  image: ghcr.io/spendice/agente1@sha256:71ce5ce1c175745ef87552225c618024165baeabfe8345761d26b8da16f06d55
  user: "${AGENTE1_UID:-1003}:${AGENTE1_GID:-1003}"
  environment:
    AGENTE1_ENV_FILE: ${AGENTE1_HOST_CONFIG:-/home/jgone/.config/agente1}/workspace-d2.env
    AGENTE1_OLLAMA_UPSTREAM: ollama:11434
    AGENTE1_ESTADO: /state
    HOME: /tmp
  volumes:
    - ${AGENTE1_HOST_CONFIG:-/home/jgone/.config/agente1}:${AGENTE1_HOST_CONFIG:-/home/jgone/.config/agente1}:ro
    - ${AGENTE1_HOST_ESTADO:-/home/jgone/p100/estado-contenedor}:/state
  networks:
    - modelo
    - salida
  mem_limit: 2g
  pids_limit: 256
  depends_on:
    ollama:
      condition: service_healthy

services:
  ollama:
    <<: *endurecido
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    user: "${AGENTE1_UID:-1003}:${AGENTE1_GID:-1003}"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /modelos
      OLLAMA_KEEP_ALIVE: 2h
      OLLAMA_NOPRUNE: "1"
      HOME: /tmp
    volumes:
      - ${OLLAMA_HOST_MODELOS:-/home/jgone/.ollama/models}:/modelos:ro
    networks:
      - modelo
    mem_limit: 20g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  consola:
    <<: *agente1
    command: ["consola"]
    ports:
      - "127.0.0.1:${AGENTE1_PUERTO_CONSOLA:-8090}:8080"

  # Apagado durante la marcha en paralelo con el runtime venv (Q6 de #124):
  # sólo arranca con el perfil `scheduler`, al hacer el cambio.
  # Ve la red `canal` y recibe los DSN del canal web cuando el perfil
  # `canal-web` está activo: así la purga diaria corre sobre la base del
  # canal. Con el perfil apagado las variables quedan vacías y el paso se
  # asienta `pendiente`, como los otros opt-in del scheduler.
  scheduler:
    <<: *agente1
    profiles: ["scheduler"]
    command:
      - scheduler
      - --loop
      - --live
      - --confirm-write-workspace
      - --ollama-model
      - gemma4:e4b
      - --ollama-timeout
      - "300"
      - --directorio
      - /state/scheduler
    environment:
      AGENTE1_ENV_FILE: ${AGENTE1_HOST_CONFIG:-/home/jgone/.config/agente1}/workspace-d2.env
      AGENTE1_OLLAMA_UPSTREAM: ollama:11434
      AGENTE1_ESTADO: /state
      AGENTE1_POSTGRES_DSN: ${AGENTE1_POSTGRES_DSN:-}
      AGENTE1_POSTGRES_DSN_MANTENIMIENTO: ${AGENTE1_POSTGRES_DSN_MANTENIMIENTO:-}
      HOME: /tmp
    networks:
      - modelo
      - salida
      - canal

  # Canal web (#149, ADR 0016): la base vive en la red interna `canal`,
  # sin puertos publicados fuera del stack, y sólo se levanta con el
  # perfil `canal-web`, igual que `web` y `worker`. La clave llega por
  # variable del stack, nunca versionada; sin clave la imagen de postgres
  # falla al inicializar, no el `config` del compose — ninguna variable
  # del perfil usa `:?`, para que el stack actual resuelva igual que
  # antes con el canal apagado. `web` y `worker` comparten la red `canal`
  # con la base; `web` además sale por `salida` para servir la consola, y
  # el `scheduler` la ve cuando el perfil está activo para la purga.
  # La base corre como el uid/gid `70:70` de `postgres:16.4-alpine`
  # —el dueño de PGDATA en la imagen—, así no necesita root ni
  # capacidades para preparar el volumen nuevo ni para reiniciar sobre
  # el existente; el volumen nombrado hereda ese dueño en su primera
  # creación. `/run` y `/tmp` van en tmpfs con modo 1777 porque el
  # entrypoint crea `/var/run/postgresql` como usuario no root. Se
  # mantienen `read_only` (escribe en el volumen y en esos tmpfs, no en
  # la raíz), `cap_drop: ALL`, `no-new-privileges`, la red interna
  # `canal` y la ausencia de puertos publicados.
  postgres:
    <<: *endurecido
    profiles: ["canal-web"]
    user: "70:70"
    tmpfs:
      - /tmp:mode=1777
      - /run:mode=1777
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${AGENTE1_POSTGRES_USUARIO:-agente1}
      POSTGRES_DB: ${AGENTE1_POSTGRES_BASE:-agente1}
      POSTGRES_PASSWORD: ${AGENTE1_POSTGRES_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data/pgdata
      HOME: /tmp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - canal
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Bootstrap de la base del canal web (#149, ADR 0016): aplica las
  # migraciones pendientes desde una base vacía y asigna las claves de
  # `agente1_app` y `agente1_mantenimiento`. Corre una vez por despliegue
  # y no reintenta: si falla, `web` y `worker` no arrancan. No depende de
  # Ollama ni monta la configuración del host; el DSN y las dos claves
  # llegan del stack de Portainer, con `${VAR:-}` para que el compose sin
  # el perfil `canal-web` resuelva igual que antes. Sólo monta `/state`,
  # donde el entrypoint deja la auditoría de integridad.
  migrador:
    <<: *agente1
    profiles: ["canal-web"]
    command: ["migrar"]
    restart: "no"
    environment:
      AGENTE1_ESTADO: /state
      AGENTE1_OLLAMA_UPSTREAM: ""
      AGENTE1_POSTGRES_ADMIN_DSN: ${AGENTE1_POSTGRES_ADMIN_DSN:-}
      AGENTE1_POSTGRES_APP_PASSWORD: ${AGENTE1_POSTGRES_APP_PASSWORD:-}
      AGENTE1_POSTGRES_MANTENIMIENTO_PASSWORD: ${AGENTE1_POSTGRES_MANTENIMIENTO_PASSWORD:-}
      HOME: /tmp
    volumes:
      - ${AGENTE1_HOST_ESTADO:-/home/jgone/p100/estado-contenedor}:/state
    networks:
      - canal
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *agente1
    profiles: ["canal-web"]
    command: ["web"]
    ports:
      - "127.0.0.1:${AGENTE1_PUERTO_WEB:-8443}:8080"
    environment:
      AGENTE1_ENV_FILE: ${AGENTE1_HOST_CONFIG:-/home/jgone/.config/agente1}/workspace-d2.env
      AGENTE1_OLLAMA_UPSTREAM: ollama:11434
      AGENTE1_ESTADO: /state
      AGENTE1_CONTENEDOR: "si"
      AGENTE1_POSTGRES_DSN: ${AGENTE1_POSTGRES_DSN:-}
      AGENTE1_PADRON_ROLES_CSV: ${AGENTE1_PADRON_ROLES_CSV:-/state/padron_roles.csv}
      AGENTE1_TABLA: ${AGENTE1_TABLA:-/state/actividades.csv}
      AGENTE1_WEB_GOOGLE_CLIENT_ID: ${AGENTE1_WEB_GOOGLE_CLIENT_ID:-}
      AGENTE1_WEB_DOMINIO: ${AGENTE1_WEB_DOMINIO:-}
      AGENTE1_WEB_MODO_DEMO: ${AGENTE1_WEB_MODO_DEMO:-}
      AGENTE1_WEB_DEMO_HASTA: ${AGENTE1_WEB_DEMO_HASTA:-}
      AGENTE1_WEB_DEMO_CORREOS: ${AGENTE1_WEB_DEMO_CORREOS:-}
      # Con `si`, el servidor exporta los Docs por Drive real (#153); la
      # config Workspace llega por `AGENTE1_ENV_FILE`, como en el worker.
      AGENTE1_WEB_DOCS: ${AGENTE1_WEB_DOCS:-}
      # Catálogo externo de audiencias del prellenado de correo (ADR
      # 0021): vive en el directorio de config del host, ya montado `ro`;
      # si el archivo no carga o le falta un público del contrato, el
      # arranque de la web cierra. Sin el archivo el servicio no arranca:
      # el default asume el despliegue de producción.
      AGENTE1_AUDIENCIAS_PATH: ${AGENTE1_AUDIENCIAS_PATH:-${AGENTE1_HOST_CONFIG:-/home/jgone/.config/agente1}/audiencias-institucionales.json}
      AGENTE1_WEB_PORT: "8080"
      HOME: /tmp
    networks:
      - canal
      - salida
    depends_on:
      migrador:
        condition: service_completed_successfully

  worker:
    <<: *agente1
    profiles: ["canal-web"]
    command:
      - worker
      - --tabla
      - /state/actividades.csv
      - --salida
      - /state/worker
      # El destino del Doc se opta por el stack (#153): sin la variable
      # el worker sigue en el fake en memoria; con `docs` pasa al
      # adapter real de Drive con la config Workspace del env file.
      - --destino-${AGENTE1_WORKER_DESTINO:-fake}
      - --ollama-model
      - gemma4:e4b
    environment:
      AGENTE1_ENV_FILE: ${AGENTE1_HOST_CONFIG:-/home/jgone/.config/agente1}/workspace-d2.env
      AGENTE1_OLLAMA_UPSTREAM: ollama:11434
      AGENTE1_ESTADO: /state
      AGENTE1_CONTENEDOR: "si"
      AGENTE1_POSTGRES_DSN: ${AGENTE1_POSTGRES_DSN:-}
      AGENTE1_WORKER_ID: worker-1
      AGENTE1_PADRON_ROLES_CSV: ${AGENTE1_PADRON_ROLES_CSV:-/state/padron_roles.csv}
      AGENTE1_WEB_DOCS_COMPARTIR: ${AGENTE1_WEB_DOCS_COMPARTIR:-}
      HOME: /tmp
    networks:
      - canal
      - modelo
    depends_on:
      migrador:
        condition: service_completed_successfully

volumes:
  postgres-data:

networks:
  modelo:
    internal: true
  salida: {}
  canal:
    internal: true
