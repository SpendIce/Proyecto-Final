function review(){const e=entry(),r=rev(e),old=r.id!==e.current,closed=!!e.decision,pending=!!e.pendingAdjustment||!!e.runningJob;return `<section><div class="review-header"><div class="row between"><span class="eyebrow muted">DEMO-${e.id} / FIE INFORMA</span>${badge(e)}</div><h2 style="margin-top:12px">${esc(e.title)}</h2><div class="muted">${esc(e.area)} · ${esc(e.owner)}</div><div class="row revision-info"><label for="revision">Revisión</label><select id="revision" style="width:auto;max-width:100%">${e.revisions.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>r${x.id} · ${esc(x.origin)}${x.id===e.current?' · vigente':''}</option>`).join('')}</select></div></div>${e.activity?activityDetails(activityOf(e)):''}${pending?`<div class="hint"><strong>${e.pendingAdjustment?'Ajuste solicitado desde r'+e.pendingAdjustment.base:'Generación en curso'}</strong><p style="white-space:pre-wrap;margin-top:8px">${esc(e.pendingAdjustment?.request??'El servidor está preparando el borrador.')}</p><small>${LIVE?'El trabajo se consulta en segundo plano. No hace falta repetir el pedido.':'Demostración sin LLM: quien guía puede incorporar una respuesta desde el panel de estado.'}</small></div>`:''}${liveTools(e)}${old?'<div class="hint">Estás viendo una revisión anterior. Para corregir o decidir, volvé a la revisión vigente.</div>':''}${editing?'<div class="hint">Edición externa simulada en curso. Al guardar y volver se incorpora una revisión nueva antes de decidir.</div>':''}${closed?`<div class="result"><strong>${esc(e.status)} · r${e.decision.revision}</strong><div>El recorrido de esta pieza terminó en A1. La decisión no acredita publicación.</div><small>Decisión de demostración · ${esc(e.decision.when)} · ${esc(e.decision.signal)}</small></div>`:''}<div class="review-layout"><article class="document"><div class="doc-label"><span>FIE INFORMA</span><span>r${r.id}</span></div><p class="muted">${r.llm?'BORRADOR — NO PUBLICAR · '+(r.llm.model?'Generado por '+esc(r.llm.model):'Armado con datos confirmados'):r.origin==='Composición local de datos'?'DATOS PRECARGADOS · Todavía no es una salida del LLM':'BORRADOR — NO PUBLICAR · '+esc(r.origin)}</p><pre>${esc(r.text)}</pre></article><div class="actions"><section class="action-group"><h3>1. Corregí el contenido</h3><p class="muted">Editá el texto en una pestaña aparte. Al volver, revisá la nueva captura.</p>${btn('Editar en Docs ↗ (simulado)','edit','',old||closed||!!editing||pending)}<p class="muted" style="margin-top:10px">El editor es una simulación local; no abre Google Docs.</p></section><section class="action-group"><h3>2. Pedí un ajuste</h3><p class="muted">Parte de la última revisión, incluidas tus correcciones. Conserva las anteriores.</p>${btn('Pedir ajuste al agente','adjust','',old||closed||!!editing||pending||sample(e.sample).modo!=='genera')}<small style="display:block;margin-top:8px">${sample(e.sample).modo!=='genera'?'Este tipo se compone con datos confirmados. Podés corregirlo con la edición manual.':LIVE?'Escribí el cambio con tus palabras. Se enviará al LLM real.':'Escribí el cambio con tus palabras. Respuesta simulada; sin LLM.'}</small></section><section class="action-group"><h3>3. Decidí sobre r${r.id}</h3><p class="muted">La aprobación cierra el recorrido en A1.</p><div class="row">${btn('Aprobar borrador','approve','primary',old||closed||!!editing||pending||(LIVE&&!e.hasLiveOutput))}${btn('Descartar','discard','danger',old||closed||!!editing||pending)}</div></section></div></div></section>`}
function steps(){return `<ol class="stepper">${['Nuevo pedido','Borrador','Revisión','Decisión'].map((s,i)=>`<li class="${(view==='new'?0:entry()?.decision?3:2)===i?'current':''}">${i+1}. ${s}</li>`).join('')}</ol>`}
function render(){document.body.className='variant-'+variant;let body;if(!logged)body=`<main class="login"><section class="panel"><div class="eyebrow muted">A1 / COMUNICACIÓN INSTITUCIONAL</div><h1 style="margin-top:16px">Del pedido al borrador, en un mismo lugar.</h1><p class="muted">Prepará gacetillas, continuá pedidos del equipo y revisá cada pieza antes de aprobarla.</p>${btn('Ingresar con Google · simulado','login','primary')}<small>Usamos una identidad de muestra. Este botón no verifica cuentas ni permisos.</small></section></main>`;else {body=`<main class="workspace"><div class="page-heading row between"><div><div class="eyebrow muted">ESPACIO DE TRABAJO SEU</div><h1 style="margin-top:7px">Creá contenido para FIE INFORMA</h1></div><div class="row">${btn('+ Nuevo pedido','new','primary new-primary')}${btn('Pedidos del equipo','inbox')}</div></div>${message?`<div class="toast" role="status">${esc(message)}</div>`:''}${variant==='B'?steps():''}${busy?'<section class="panel"><h2>Preparando la muestra…</h2><p>El pedido está en la bandeja. Esta espera es simulada.</p><div class="progress"></div></section>':view==='new'?formView():variant==='A'?`<div class="columns">${inbox()}${view==='review'?review():'<section class="panel"><h2>Elegí una pieza para continuar</h2><p class="muted">O creá un nuevo pedido con los datos precargados.</p></section>'}</div>`:view==='review'?review():inbox()}${state()}</main>`}document.getElementById('app').innerHTML=header()+body+switcher();}
function modal(html){const m=document.getElementById('modal');m.innerHTML=html;m.showModal()}
function closeModal(){document.getElementById('modal').close()}
function switchVariant(delta){const keys=['A','B','C'];variant=keys[(keys.indexOf(variant)+delta+3)%3];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
function freshRevision(e,text,origin){const base=e.current;e.current++;e.viewed=e.current;e.revisions.push({id:e.current,text,origin,basedOn:base});e.events.push({action:'revision_creada',revision:e.current,basedOn:base});}
function action(a){if(a==='prev'||a==='next'){switchVariant(a==='next'?1:-1);return}if(a==='about'){modal(`<h2>Alcance de esta demostración</h2><div class="scroll"><p>La pregunta es qué disposición facilita pedir, corregir y decidir sin perder contexto, y qué calidad tienen los textos producidos por el LLM real. A, B y C comparten contenido y estado.</p><p>Se simulan identidad Google, padrón, permisos, Google Docs y decisiones. ${LIVE?'La generación y los ajustes de difusión usan gemma4:e4b; no se publican ni envían piezas.':'La generación también está simulada.'} ${LIVE?'En este servicio se usa el LLM real del servidor y los controles mecánicos existentes. No hay conexión a Workspace ni autenticación institucional.':'No hay conexión a servicios institucionales ni ejecución del agente.'} No hay persistencia ni recuperación del canal web.</p><p>Los nuevos pedidos usan la descripción y los datos cargados por la persona. Saludo/efeméride genera prosa con el modelo; los tipos de datos confirmados se componen con su forma declarada y no reutilizan el texto de los ejemplos. Difusión usa nueve actividades reales de nuestras pruebas: ocho del corpus FIE INFORMA y NotebookLM Nivel 2. Los textos iniciales se componen localmente desde los datos. Las revisiones identificadas como LLM se producen en el servidor. Hay campos provisionales o faltantes, visibles en su procedencia.</p><p>Tipos y áreas proceden de <code>tipos_gacetilla_v1.json</code> y <code>areas_emisoras_v1.json</code>, ambos provisionales. La firma de área se adapta a la selección. La descripción del pedido aporta contexto o contenido propio; el asunto sólo identifica la pieza. El ajuste admite texto libre y conserva la captura base. ${LIVE?'La respuesta se obtiene del LLM del servidor.':'En modo sin conexión, quien guía puede incorporar una respuesta de prueba desde el panel de estado.'}</p><p>Todo vive en memoria y se pierde al recargar. El panel de estado muestra fuente, hash, revisiones y señales de la demostración. La prueba guiada SEU y la conformidad del contenido se registran por separado.</p></div>${btn('Volver','close')}`);return}if(a==='close'){closeModal();return}if(a==='login'){logged=true;view='new'}if(a==='logout'){if(editing){message='Terminá la edición de muestra antes de salir.';render();return}logged=false}if(a==='new'){form={type:SAMPLES[0].id,area:SAMPLES[0].area,notes:'',activity:'FIE-DIF-08',subject:'',fields:{}};view='new';message=''}if(a==='inbox'){view='inbox';message=''}if(a==='create'){create();return}if(a==='edit'){openEditor();return}if(a==='adjust'){adjust();return}if(a==='apply-adjust'){applyAdjust();return}if(a==='generate-real'){liveRequest(entry());return}if(a==='retry-poll'){pollJob(entry());return}if(a==='evaluate'){evaluateContent();return}if(a==='save-evaluation'){saveEvaluation();return}if(a==='export'){exportEvidence();return}if(a==='simulate-response'){simulateResponse();return}if(a==='receive-adjust'){receiveAdjust();return}if(a==='cancel-adjust'){cancelAdjust();return}if(a==='approve'||a==='discard'){decide(a);return}if(a==='confirm-decision'){confirmDecision();return}render()}
function create(){if(busy)return;const f=document.getElementById('request');if(!f.reportValidity())return;form.notes=document.getElementById('notes').value;form.subject=document.getElementById('subject').value.trim();form.area=document.getElementById('area').value;const s=sample(form.type),a=s.requiere_actividad?ACTIVITIES.find(x=>x.id===form.activity):null,e=makeEntry(sequence++,s,'Vos · persona de muestra',a);e.area=form.area;e.notes=form.notes;e.subject=form.subject;e.title=form.subject||a?.fields.titulo||s.nombre;e.fields={...form.fields};e.revisions[0]={id:1,text:'',origin:'Pedido sin generar',basedOn:null};entries.unshift(e);selected=e.id;view='review';if(LIVE){liveRequest(e);return}e.status='Pedido preparado';message='Pedido preparado con tus datos. Abrí la URL del servidor para generar el contenido.';render()}
function canChange(){const e=entry();return logged&&e&&!e.decision&&e.viewed===e.current&&!e.pendingAdjustment&&!e.runningJob&&!editing&&!busy}
function adjust(){if(!canChange())return;const e=entry();modal(`<h2>Pedir un ajuste desde r${e.current}</h2><p>El agente partirá de esta revisión, incluidas tus correcciones. El resultado será una revisión nueva, sujeta a los controles de contenido.</p><form id="adjust-form"><label class="field-label" for="adjustment">¿Qué querés cambiar?</label><textarea id="adjustment" required maxlength="3000" placeholder="Por ejemplo: hacé la introducción más breve y mantené los datos de inscripción y las correcciones que hice."></textarea><p class="muted">Podés escribir el pedido con tus palabras. ${LIVE?'La solicitud se envía al LLM del servidor con esta revisión y los datos autorizados de la actividad.':'En modo sin conexión se registra la solicitud; la respuesta se simula por separado.'}</p><div class="row" style="margin-top:20px">${btn('Solicitar ajuste','apply-adjust','primary')}${btn('Cancelar','close')}</div></form>`);document.getElementById('adjustment').focus()}
function applyAdjust(){if(!canChange())return;const field=document.getElementById('adjustment');field.setCustomValidity(field.value.trim()?'':'Escribí qué cambio necesitás.');if(!field.reportValidity())return;const e=entry();e.pendingAdjustment={request:field.value.trim(),base:e.current,snapshot:latest(e).text};e.status='Ajuste solicitado';e.events.push({action:'ajuste_solicitado_simulado',base:e.current,request:field.value.trim()});closeModal();if(LIVE){liveRequest(e,e.pendingAdjustment.request,e.pendingAdjustment.snapshot);return}message=`Pedido de ajuste registrado desde r${e.current}. La respuesta del agente sigue pendiente en esta demostración.`;render()}
function simulateResponse(){const e=entry();if(!e?.pendingAdjustment||editing||e.decision)return;modal(`<h2>Respuesta de prueba · simulación</h2><p class="muted">Control de quien guía; no es un editor del producto. Pegá o prepará una respuesta al pedido usando la última revisión como base.</p><p style="white-space:pre-wrap">${esc(e.pendingAdjustment?.request??'El servidor está preparando el borrador.')}</p><label class="field-label" for="simulated-response">Respuesta completa de muestra</label><textarea id="simulated-response" style="min-height:45vh" required>${esc(e.pendingAdjustment.snapshot)}</textarea><div class="row" style="margin-top:16px">${btn('Incorporar respuesta simulada','receive-adjust','primary')}${btn('Volver','close')}</div>`)}
function receiveAdjust(){const e=entry(),p=e?.pendingAdjustment,field=document.getElementById('simulated-response');if(!p||editing||e.decision)return;field.setCustomValidity(field.value.trim()?'':'Ingresá el texto completo de respuesta.');if(!field.reportValidity())return;if(e.current!==p.base){closeModal();message='La revisión cambió: la respuesta no se incorporó.';render();return}freshRevision(e,field.value,'Respuesta de ajuste simulada');latest(e).adjustmentRequest=p.request;e.pendingAdjustment=null;e.status='Pendiente de revisión';closeModal();message=`Respuesta simulada incorporada como r${e.current}, basada en r${p.base}. Revisala antes de decidir.`;render()}
function cancelAdjust(){const e=entry();if(!e?.pendingAdjustment)return;e.events.push({action:'espera_simulada_cancelada',base:e.pendingAdjustment.base});e.pendingAdjustment=null;e.status='Pendiente de revisión';message='Espera de demostración cancelada. Se conserva la revisión anterior.';render()}
let pendingDecision=null;
function decide(kind){if(!canChange())return;const e=entry();pendingDecision={kind,entry:e.id,revision:e.current,text:latest(e).text};modal(`<h2>${kind==='approve'?'Aprobar el borrador':'Descartar la pieza'} · r${e.current}</h2><p>La decisión quedará vinculada al contenido de esta revisión.</p><p class="muted">Simulación local. La aprobación cierra el recorrido sin publicar ni aportar automáticamente a Historia Viva.</p><label class="field-label" for="reason">Comentario (opcional)</label><textarea id="reason" placeholder="Si querés, dejá una observación."></textarea><div class="row" style="margin-top:20px">${btn(kind==='approve'?'Confirmar aprobación':'Confirmar descarte','confirm-decision',kind==='approve'?'primary':'danger')}${btn('Volver a revisar','close')}</div>`)}
function confirmDecision(){const d=pendingDecision,e=entry();if(!d||!canChange()||d.entry!==e.id||d.revision!==e.current||d.text!==latest(e).text){closeModal();message='La revisión cambió. Actualizá el contenido antes de decidir.';render();return}e.status=d.kind==='approve'?'Borrador aprobado':'Descartado';const human=e.revisions.some(r=>r.origin==='Edición humana simulada');e.decision={kind:d.kind,revision:e.current,when:new Date().toLocaleString('es-AR'),identity:'Persona SEU de muestra',comment:document.getElementById('reason').value,signal:human?'Con intervención humana':e.revisions.length>1?'Con ajuste simulado':'Sin cambios de la muestra',publicado:false};e.events.push({action:d.kind,revision:e.current});pendingDecision=null;closeModal();message='Decisión simulada registrada sobre la revisión visible.';render()}
function openEditor(){if(!canChange())return;const e=entry();const url=new URL(location);url.searchParams.set('editor','1');editorWindow=window.open(url,'_blank');if(!editorWindow){message='El navegador bloqueó la pestaña. Habilitá ventanas emergentes para ensayar la edición.';render();return}editing={entry:e.id,base:e.current,text:latest(e).text};message='Se abrió el editor de muestra en otra pestaña.';render()}
window.addEventListener('message',event=>{if(!editing||event.source!==editorWindow)return;const d=event.data;if(d?.kind==='editor-ready'){editorWindow.postMessage({kind:'editor-content',text:editing.text,base:editing.base},'*')}if(d?.kind==='editor-save'&&typeof d.text==='string'){const e=entries.find(x=>x.id===editing.entry);if(e.current!==editing.base||e.decision){message='Conflicto de revisión. La captura no se incorporó.'}else if(d.text!==editing.text){freshRevision(e,d.text,'Edición humana simulada');message=`Cambios incorporados como r${e.current}. Revisá esta captura antes de decidir.`}else{message='Se recuperó la captura; el texto no cambió.'}editing=null;editorWindow=null;render()}});
window.addEventListener('focus',()=>{if(editing&&editorWindow?.closed){editing=null;editorWindow=null;message='La pestaña se cerró sin guardar cambios. Se conserva la revisión anterior.';render()}});
document.addEventListener('click',event=>{const el=event.target.closest('[data-action],[data-open]');if(!el)return;if(el.tagName==='BUTTON')event.preventDefault();if(el.dataset.open){selected=Number(el.dataset.open);view='review';message='';render()}else action(el.dataset.action)});
document.addEventListener('change',event=>{if(event.target.id==='type'){form.notes=document.getElementById('notes').value;form.type=event.target.value;form.area=sample(form.type).area;render()}if(event.target.id==='activity'){form.activity=event.target.value;render()}if(event.target.id==='area')form.area=event.target.value;if(event.target.id==='revision'){entry().viewed=Number(event.target.value);render()}});
document.addEventListener('input',event=>{if(event.target.id==='notes')form.notes=event.target.value;if(event.target.id==='subject')form.subject=event.target.value;if(event.target.dataset.field)form.fields[event.target.dataset.field]=event.target.value;if(event.target.id==='adjustment')event.target.setCustomValidity('');if(event.target.id==='simulated-response')event.target.setCustomValidity('')});
document.addEventListener('submit',event=>{if(event.target.id==='request'){event.preventDefault();create()}if(event.target.id==='adjust-form'){event.preventDefault();applyAdjust()}});
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable="true"]')||document.getElementById('modal').open)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();switchVariant(event.key==='ArrowLeft'?-1:1)}});

function liveTools(e){return `<section class="action-group" style="margin-bottom:18px"><div class="row between"><div><strong>${LIVE?'Borrador y calidad de contenido':'Contenido de muestra'}</strong><div class="muted">${LIVE?(sample(e.sample).modo==='genera'?'gemma4:e4b · controles automáticos + evaluación humana':'Composición con datos confirmados · sin prosa generada por LLM'):'Abrí la URL del servidor para usar el LLM real.'}</div></div><div class="row">${LIVE?btn(e.hasLiveOutput?(sample(e.sample).modo==='genera'?'Generar otra revisión':'Preparar otra revisión'):(sample(e.sample).modo==='genera'?'Generar con LLM':'Preparar borrador'),'generate-real','',!!e.runningJob||!!e.pendingAdjustment||!!editing||!!e.decision||e.viewed!==e.current):''}${btn('Evaluar contenido','evaluate')}${btn('Descargar evidencia','export')}</div></div>${e.lastResult?`<div style="margin-top:12px"><strong>${esc(e.lastResult.state)}</strong> · ${esc(e.lastResult.model??'composición de datos')} · ${esc(e.lastResult.latency_s??'—')} s<div class="muted">Controles: ${esc(e.lastResult.mechanical_checks??'sin completar')}. Calidad humana: ${e.evaluations?.[e.viewed]?'evaluación registrada':'pendiente'}.</div>${e.lastResult.errors?.length?`<p>${esc(e.lastResult.message??'La salida no pasó los controles; se conserva la revisión previa.')} ${esc(e.lastResult.errors.join(', '))}</p>`:''}${e.lastResult.candidate?`<details><summary>Ver salida rechazada para diagnóstico (no aprobable)</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(e.lastResult.candidate)}</pre></details>`:''}</div>`:''}${e.pollError?`<p>${esc(e.pollError)}</p>${btn('Volver a consultar el trabajo','retry-poll')}`:''}</section>`}
async function liveRequest(e,request='',base=''){
 if(!LIVE||!e||e.runningJob||editing||e.decision)return;
 if(sample(e.sample).modo==='genera'&&!backend?.live){message='El LLM no está disponible. No se sustituyó por una muestra.';render();return}
 if(e.activity&&e.area!==sample(e.sample).area){message='La forma declarada de difusión usa el pie de Cursos Complementarios y SEU. Elegí esa área para generar este tipo.';render();return}
 const requestId=globalThis.crypto?.randomUUID?.()??String(Date.now())+'-'+Math.random().toString(16).slice(2);
 const baseRevision=e.current;e.runningJob='enviando';e.pollError=null;e.status=sample(e.sample).modo==='genera'?(request?'Ajustando con LLM':'Generando con LLM'):'Armando borrador';render();
 try{
 const response=await fetch('/api/generations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({activity:e.activity,type:e.sample,subject:e.subject??'',area:e.area,fields:e.fields??{},notes:e.notes,request,base_text:base,base_revision:baseRevision,request_id:requestId})});const result=await response.json();
 if(!response.ok){e.runningJob=null;e.pendingAdjustment=null;e.status='Generación no completada';e.lastResult={state:'rechazado',errors:result.missing??[],message:result.message};message=result.message;render();return}
 e.runningJob=result.id;pollJob(e);
 }catch(error){e.runningJob=null;e.pendingAdjustment=null;e.status='Conexión interrumpida';message='No se pudo confirmar el pedido. No se creó una revisión ni se usó una muestra.';render()}
}
async function pollJob(e){
 if(!e?.runningJob||e.runningJob==='enviando')return;
 try{const response=await fetch('/api/jobs/'+encodeURIComponent(e.runningJob),{cache:'no-store'});const result=await response.json();if(!response.ok)throw Error('Consulta no disponible');
 e.pollError=null;if(['encolado','generando'].includes(result.state)){e.status=result.state==='encolado'?'En espera':sample(e.sample).modo==='genera'?'Generando con LLM':'Armando borrador';render();setTimeout(()=>pollJob(e),1500);return}
 e.lastResult=result;e.runningJob=null;
 if(result.state==='completado'&&result.base_revision===e.current&&!e.decision){freshRevision(e,result.text,e.pendingAdjustment?'Ajuste por LLM':'Generación por LLM');latest(e).llm=result;latest(e).origin=result.production_mode==='extrae_y_confirma'?'Composición de datos confirmados':latest(e).origin;latest(e).adjustmentRequest=e.pendingAdjustment?.request;e.hasLiveOutput=true;e.status='Pendiente de revisión';message=`Borrador: nueva revisión r${e.current} en ${result.latency_s} s. Controles mecánicos conformes; calidad humana pendiente.`;e.evaluation=null}
 else{e.status=result.state==='completado'?'Conflicto de revisión':'Generación no conforme';message='No se incorporó una nueva revisión. Revisá el resultado y los motivos del control.'}
 e.pendingAdjustment=null;render();
 }catch(error){e.pollError='La consulta se interrumpió. El servidor puede seguir trabajando; consultá este mismo trabajo sin generar otro.';render()}
}
function evaluateContent(){const e=entry(),evaluation=e.evaluations?.[e.viewed];modal(`<h2>Evaluación humana de contenido · r${e.viewed}</h2><p class="muted">Registro separado de aprobar o descartar. Escala vigente del eje 1: 1, no publicable; 2, requiere reescritura mayor; 3, retoque menor; 4, tal cual. Puntuar una muestra no evalúa al LLM.</p>${[['parecido','Parecido a FIE INFORMA'],['fidelidad','Fidelidad de sentido frente a la fuente'],['claridad','Claridad y uso']].map(([key,label])=>`<label class="field-label" for="score-${key}">${label}</label><select id="score-${key}"><option value="">Sin puntuar</option>${[1,2,3,4].map(n=>`<option value="${n}" ${evaluation?.scores[key]===n?'selected':''}>${n}</option>`).join('')}</select>`).join('')}<label class="field-label" for="quality-notes">Observaciones de quien evalúa</label><textarea id="quality-notes">${esc(evaluation?.notes??'')}</textarea><div class="row" style="margin-top:16px">${btn('Guardar evaluación de esta revisión','save-evaluation','primary')}${btn('Cancelar','close')}</div>`)}
function saveEvaluation(){const e=entry();e.evaluation={revision:e.viewed,at:new Date().toISOString(),scores:Object.fromEntries(['parecido','fidelidad','claridad'].map(key=>[key,Number(document.getElementById('score-'+key).value)||null])),notes:document.getElementById('quality-notes').value,participant:'sin identificación institucional',institutional_validation:false};e.evaluations??={};e.evaluations[e.viewed]=e.evaluation;closeModal();message=`Evaluación de contenido guardada para r${e.viewed}. Podés descargarla con la evidencia.`;render()}
function exportEvidence(){const data={prototype:true,at:new Date().toISOString(),backend,variant,entries:entries.map(e=>({id:e.id,activity:e.activity,status:e.status,revisions:e.revisions,evaluation:e.evaluation,evaluations:e.evaluations,last_result:e.lastResult,decision:e.decision,source:e.activity?activityOf(e):{origin:'Pedido manual',subject:e.subject,description:e.notes,fields:e.fields,area:e.area}}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='evidencia-prototipo-a1-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
if(LIVE&&params.get('editor')!=='1')fetch('/api/health').then(r=>r.json()).then(data=>{backend=data;render()}).catch(()=>{backend={live:false};message='No se pudo contactar al servicio del LLM.';render()});

if(params.get('editor')==='1'){
 document.body.className='';document.getElementById('app').innerHTML=`<div class="notice">EDITOR EXTERNO SIMULADO · No es Google Docs · Sin conexión ni persistencia</div><main class="editor"><div class="row between"><div><h1>Edición de la gacetilla</h1><p class="muted">Modificá la muestra. Guardar devuelve el texto a A1 como una revisión nueva.</p></div><button id="save-editor" class="primary" disabled>Guardar y volver a A1</button></div><label class="field-label" for="editor-text">Contenido de muestra</label><textarea id="editor-text" disabled></textarea></main>`;
 window.addEventListener('message',event=>{if(event.source!==window.opener||event.data?.kind!=='editor-content')return;document.getElementById('editor-text').value=event.data.text;document.getElementById('editor-text').disabled=false;document.getElementById('save-editor').disabled=false});
 document.getElementById('save-editor').onclick=()=>{if(!window.opener)return;window.opener.postMessage({kind:'editor-save',text:document.getElementById('editor-text').value},'*');window.opener.focus();window.close()};
 if(window.opener)window.opener.postMessage({kind:'editor-ready'},'*');
}else render();
</script></body></html>
