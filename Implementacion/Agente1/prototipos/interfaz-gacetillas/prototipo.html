<style>
:root{font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202c3b;background:#f3f5f7;--navy:#172b42;--teal:#14675d;--line:#dce2e8;--muted:#617082}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--navy);border-radius:8px;padding:10px 15px;font-weight:650}button:hover{background:#edf3f5}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button.danger{color:#99382e}button:disabled{cursor:default;opacity:.45}a{color:#14675d}h1,h2,h3,p{margin:0 0 12px}h1{font-size:29px;letter-spacing:-.8px;line-height:1.2}h2{font-size:20px;letter-spacing:-.4px}h3{font-size:16px}small,.muted{color:var(--muted);font-size:13px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase}.notice{padding:9px 22px;background:#fcf1d9;color:#684f20;font-size:12px;display:flex;justify-content:space-between;gap:12px}.notice button{padding:0;background:none;border:0;color:inherit;font-size:12px;text-decoration:underline}header{background:white;border-bottom:1px solid var(--line);padding:18px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;gap:12px;align-items:center}.mark{background:var(--navy);color:white;border-radius:10px;padding:9px 12px;font-size:18px;font-weight:750}.user{display:flex;gap:12px;align-items:center}.avatar{background:#e2eee9;border-radius:50%;padding:8px;font-weight:700;color:#195d50}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.workspace{max-width:1500px;margin:auto;padding:28px 32px 120px}.page-heading{margin-bottom:24px}.badge{display:inline-block;border-radius:5px;background:#fff0d3;color:#78531c;font-size:11px;letter-spacing:.2px;padding:4px 9px;font-weight:750}.badge.closed{background:#dfefe7;color:#205a43}.badge.gray{background:#edf0f5;color:#4b5d73}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px}.inbox{min-width:0}.inbox-list{display:grid;gap:10px}.item{text-align:left;width:100%;padding:16px;border-radius:10px;display:block;font-weight:400}.item.active{border-color:var(--teal);background:#eff7f4;box-shadow:inset 3px 0 var(--teal)}.item strong{display:block;margin:9px 0 6px;line-height:1.35;font-size:14px}.item small{display:block}.columns{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}.review-header{margin-bottom:20px}.document{background:white;border:1px solid var(--line);padding:38px 46px;min-width:0;border-radius:7px;box-shadow:0 6px 20px #152a4206}.document .doc-label{border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:25px;color:var(--navy);display:flex;justify-content:space-between;font-size:12px;font-weight:750;letter-spacing:1.7px}.document pre{font:15px/1.85 Georgia,"Times New Roman",serif;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:#263342}.actions{margin-top:20px;display:grid;gap:16px}.action-group{padding:18px;background:#f8fafb;border:1px solid var(--line);border-radius:9px}.action-group h3{margin-bottom:8px}.revision-info{padding:12px 0;font-size:13px}.hint{background:#edf4f7;border-left:3px solid #48758c;padding:12px 15px;margin-bottom:16px;font-size:13px}.result{padding:18px;background:#e8f3ed;border:1px solid #bfdacb;border-radius:8px;margin-bottom:16px}.form{max-width:760px}.form label,.field-label{display:block;margin:20px 0 7px;font-size:13px;font-weight:700}input,select,textarea{width:100%;border:1px solid #bcc8d3;border-radius:7px;padding:11px;background:white;color:inherit}textarea{min-height:95px;resize:vertical}input[readonly]{background:#f6f8fa}.form .summary{background:#f3f6f8;padding:16px;margin-top:14px;border-radius:8px;font-size:13px}.form .foot{padding-top:20px;margin-top:24px;border-top:1px solid var(--line)}.login{max-width:510px;margin:70px auto}.login .panel{padding:38px}.login button{width:100%;margin:20px 0 12px}.stepper{display:flex;gap:0;margin:22px 0 30px;list-style:none;padding:0}.stepper li{flex:1;border-bottom:3px solid #dce3e8;padding:10px 0;color:var(--muted);font-size:13px}.stepper li.current{border-color:var(--teal);color:var(--teal);font-weight:750}.variant-B .workspace{max-width:1050px}.variant-B .inbox-list{display:table;width:100%;border-collapse:separate;border-spacing:0 10px}.variant-B .item{display:grid;grid-template-columns:135px 1fr 220px;gap:20px;align-items:center}.variant-B .item strong{margin:0}.variant-B .review-layout{max-width:820px;margin:auto}.variant-B .actions{grid-template-columns:1fr 1fr}.variant-B .action-group:last-child{grid-column:1/-1}.variant-C .workspace{max-width:1480px}.variant-C .review-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:28px;align-items:start}.variant-C .actions{margin-top:0;position:sticky;top:20px}.variant-C .inbox-list{grid-template-columns:repeat(3,1fr)}.variant-C .document{padding:52px 62px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172b42;color:white;border:1px solid #536477;padding:8px;border-radius:50px;display:flex;align-items:center;gap:13px;box-shadow:0 8px 35px #12223640;z-index:10;white-space:nowrap}.switcher button{background:#29425b;color:white;border:0;border-radius:50%;padding:8px 13px}.switcher strong{font-size:13px}.switcher small{color:#b9cbdc;font-size:10px;display:block;text-align:center}.state{margin-top:28px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:12px}.state pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eaf0f3;padding:14px;border-radius:8px}.state summary{cursor:pointer}.toast{background:#172b42;color:white;padding:12px 20px;border-radius:8px;margin-bottom:18px}.modal{max-width:760px;border:1px solid #b5c2cd;border-radius:12px;padding:28px;color:#203043;width:calc(100% - 30px)}dialog::backdrop{background:#15283f80}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}dialog .scroll{max-height:60vh;overflow:auto;margin:18px 0}.progress{height:6px;background:#dbe6e3;border-radius:8px;overflow:hidden;margin:20px 0}.progress:after{content:'';display:block;width:40%;height:100%;background:var(--teal);animation:wait 1s infinite alternate}@keyframes wait{to{transform:translateX(150%)}}.editor{max-width:1000px;margin:30px auto;padding:0 20px}.editor textarea{min-height:65vh;font:16px/1.8 Georgia,serif}.compact-button{padding:6px 10px;font-size:12px}
@media(max-width:1000px){.columns{grid-template-columns:240px minmax(0,1fr)}.variant-C .review-layout{grid-template-columns:1fr}.variant-C .actions{position:static;grid-template-columns:1fr 1fr}.variant-C .action-group:last-child{grid-column:1/-1}.variant-C .inbox-list{grid-template-columns:1fr 1fr}.document,.variant-C .document{padding:28px}}
@media(max-width:700px){header{padding:16px}.user .muted,.user .avatar{display:none}.notice{padding:9px 16px;display:block}.notice button{margin-left:8px}.workspace{padding:22px 16px 120px}.columns{grid-template-columns:1fr}.columns .inbox-list{max-height:200px;overflow:auto}.panel{padding:18px}.document,.variant-C .document{padding:23px 20px}.variant-B .item{display:block}.variant-B .item strong{margin:9px 0}.variant-B .actions,.variant-C .actions,.variant-C .inbox-list{grid-template-columns:1fr}.switcher{gap:8px;bottom:12px;max-width:calc(100% - 16px)}.switcher strong{font-size:11px}.login{margin:30px 16px}.login .panel{padding:26px}h1{font-size:25px}.stepper li{font-size:11px}.document pre{font-size:15px}.row>button{max-width:100%}}

<!-- Prototipo descartable: tres estructuras de interfaz sobre un mismo recorrido; ?variant=A|B|C. -->
<body><div id="app"></div><dialog id="modal" class="modal"></dialog>
<script>
const SAMPLES=[{"id": "difusion_de_actividad", "nombre": "Difusion de actividad de extension", "modo": "genera", "requiere_actividad": true, "text": "Asunto: Taller sintético de vinculación\n\nTaller de práctica para acercar la ingeniería a la comunidad con propuestas de extensión abiertas.\n\nEl Departamento de Cursos Complementarios invita a estudiantes de todas las carreras a participar de propuestas de extensión abiertas a la comunidad.\n\n📅 miércoles 5 de agosto de 2026\nFinaliza: miércoles 19 de agosto de 2026\n🕒 14:00\nModalidad: presencial\nDuración: 6 h\nOrganiza: Departamento de Cursos Complementarios\nLugar: Aula 12, Av. Cabildo 15\nInscripción hasta: lunes 3 de agosto de 2026\nInscripción: https://example.invalid/inscripciones/syn-001\n\nConsultas: cursos@fie.undef.edu.ar\n\nDepartamento de Cursos Complementarios\nSecretaría de Extensión Universitaria\n\n--\nFacultad de Ingeniería del Ejército\n\"Grl Div Manuel N Savio\"\nUNDEF\nTel: (011) 4779-3300\nAv. Cabildo 15 – CABA\nwww.fie.undef.edu.ar", "title": "Taller sintético de vinculación", "area": "Departamento de Cursos Complementarios", "source": "Implementacion/Agente1/golden/formas/difusion_de_actividad.md", "sha256": "3f38796b8a39a229f53ec1fadce9e99a63ef18501fc4f33f8efe1af2fdbe88e0"}, {"id": "cronica_de_evento", "nombre": "Cronica de evento", "modo": "extrae_y_confirma", "requiere_actividad": false, "destino_declarado": "genera desde Historia Viva cuando el Acervo tenga el material del evento (ver el adendo del 17/10 en #120)", "text": "Asunto: Visita de la comisión de extensión al laboratorio de electrónica\n\nNOTICIAS FIE\n\nLa comisión de extensión recorrió el laboratorio de electrónica junto a docentes y estudiantes. Durante la visita se presentaron los proyectos en curso y se acordaron las próximas actividades conjuntas.\n\n--\nFacultad de Ingeniería del Ejército\n\"Grl Div Manuel N Savio\"\nUNDEF\nTel: (011) 4779-3300\nAv. Cabildo 15 – CABA\nwww.fie.undef.edu.ar", "title": "Visita de la comisión de extensión al laboratorio de electrónica", "area": "Departamento de Cursos Complementarios", "source": "Implementacion/Agente1/golden/formas/cronica_de_evento.md", "sha256": "5ce85606828819e3f272b0aecff809b0753db8f15963438df87a61251420d7c0"}, {"id": "aviso_de_otra_area", "nombre": "Aviso de otra area", "modo": "extrae_y_confirma", "requiere_actividad": false, "text": "Asunto: Estacionamiento de motos\n\nSe informa a la comunidad educativa que el estacionamiento para motos no estará habilitado, a partir del lunes 2 de noviembre de 2026, hasta nuevo aviso.\n\nMuchas gracias\n\nSecretaría Académica\n\n--\nFacultad de Ingeniería del Ejército\n\"Grl Div Manuel N Savio\"\nUNDEF\nTel: (011) 4779-3300\nAv. Cabildo 15 – CABA\nwww.fie.undef.edu.ar", "title": "Estacionamiento de motos", "area": "Secretaría Académica", "source": "Implementacion/Agente1/golden/formas/aviso_de_otra_area.md", "sha256": "189b6f82a49fa72f0b0abe4c5f068583b3304560e3518a1e577dfc50b1a84a87"}, {"id": "convocatoria_interna", "nombre": "Convocatoria interna", "modo": "extrae_y_confirma", "requiere_actividad": false, "text": "Asunto: Convocatoria interna de tutores\n\nSe convoca a docentes de la casa a la convocatoria interna de tutores para el segundo semestre.\n\nRequisitos: tener dos años de antigüedad y disponibilidad horaria.\n\nFecha límite: domingo 15 de noviembre de 2026\n\nConsultas: doe@fie.undef.edu.ar\n\nSecretaría Académica\n\n--\nFacultad de Ingeniería del Ejército\n\"Grl Div Manuel N Savio\"\nUNDEF\nTel: (011) 4779-3300\nAv. Cabildo 15 – CABA\nwww.fie.undef.edu.ar", "title": "Convocatoria interna de tutores", "area": "Secretaría Académica", "source": "Implementacion/Agente1/golden/formas/convocatoria_interna.md", "sha256": "f89ec0eb077c9e5cd7913aa4e6963daf6c873c710547fbe859067cff530c5e82"}, {"id": "saludo_o_efemeride", "nombre": "Saludo o efemeride", "modo": "genera", "requiere_actividad": false, "text": "Asunto: Día del Ingeniero\n\nEn el Día del Ingeniero saludamos a toda la comunidad de la facultad y reconocemos el trabajo de quienes ejercen la profesión con compromiso y vocación de servicio.\n\n--\nFacultad de Ingeniería del Ejército\n\"Grl Div Manuel N Savio\"\nUNDEF\nTel: (011) 4779-3300\nAv. Cabildo 15 – CABA\nwww.fie.undef.edu.ar", "title": "Día del Ingeniero", "area": "Departamento de Cursos Complementarios", "source": "Implementacion/Agente1/golden/formas/saludo_o_efemeride.md", "sha256": "6b8069a0db294200e92ddb83303016018b13acb963288f4770171f448d7820f6"}, {"id": "fallecimiento", "nombre": "Comunicado de fallecimiento", "modo": "extrae_y_confirma", "requiere_actividad": false, "text": "Asunto: Informar fallecimiento\n\nCon profundo pesar informamos el fallecimiento de María Ejemplo, quien fuera docente de la casa.\n\nEl viernes 23 de octubre se realizará un responso a las 11:00 en Capilla del Instituto.\n\nAcompañamos a su familia en este doloroso momento y elevamos nuestras plegarias por su eterno descanso.\n\n--\nFacultad de Ingeniería del Ejército\n\"Grl Div Manuel N Savio\"\nUNDEF\nTel: (011) 4779-3300\nAv. Cabildo 15 – CABA\nwww.fie.undef.edu.ar", "title": "Informar fallecimiento", "area": "Departamento de Cursos Complementarios", "source": "Implementacion/Agente1/golden/formas/fallecimiento.md", "sha256": "6bb460b73a74e037cb8ef867697e43c0fffae842284ffda70abd5d601774e8bd"}, {"id": "newsletter", "nombre": "Newsletter", "modo": "extrae_y_confirma", "requiere_actividad": false, "text": "Asunto: Boletín del Observatorio\n\nLink archivo adjunto:\nhttps://example.invalid/boletin\n\nSecretaría de Extensión Universitaria\n\n--\nFacultad de Ingeniería del Ejército\n\"Grl Div Manuel N Savio\"\nUNDEF\nTel: (011) 4779-3300\nAv. Cabildo 15 – CABA\nwww.fie.undef.edu.ar", "title": "Boletín del Observatorio", "area": "Secretaría de Extensión Universitaria", "source": "Implementacion/Agente1/golden/formas/newsletter.md", "sha256": "fecfd2feda72bd6182cc57bff4957547a1a825dd59461b257e7fb4607e1b638e"}], AREAS=[{"id": "cursos_complementarios", "nombre": "Departamento de Cursos Complementarios"}, {"id": "secretaria_de_extension", "nombre": "Secretaría de Extensión Universitaria"}, {"id": "secretaria_academica", "nombre": "Secretaría Académica"}, {"id": "doe", "nombre": "DOE"}];
const names={A:'Bandeja y pieza',B:'Recorrido por pasos',C:'Documento y acciones'};
const params=new URLSearchParams(location.search);let variant=names[params.get('variant')]?params.get('variant'):'A';
let logged=false,view='inbox',selected=1,sequence=3,message='',editing=null,editorWindow=null,busy=false;
let form={type:SAMPLES[0].id,area:SAMPLES[0].area,notes:''};
const entries=[makeEntry(1,SAMPLES[0],'Integrante SEU · muestra'),makeEntry(2,SAMPLES[2],'Otra persona del equipo · muestra')];
function makeEntry(id,s,owner){return {id,sample:s.id,title:s.title,area:s.area,owner,notes:'',status:'Pendiente de revisión',revisions:[{id:1,text:s.text,origin:'Salida de muestra',basedOn:null}],current:1,viewed:1,decision:null,events:[]}}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sample=id=>SAMPLES.find(s=>s.id===id),entry=()=>entries.find(e=>e.id===selected),rev=e=>e.revisions.find(r=>r.id===e.viewed),latest=e=>e.revisions.at(-1);
const btn=(label,action,cls='',disabled=false)=>`<button class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
function badge(e){return `<span class="badge ${e.decision?'closed':''}">${esc(e.status)}</span>`}
function header(){return `<div class="notice"><span>PROTOTIPO DESCARTABLE · Datos de muestra · Operaciones simuladas · Al recargar se reinicia</span><button data-action="about">Qué está simulado</button></div><header><div class="brand"><span class="mark">A1</span><div><strong>Extensión Bot</strong><div class="muted">Secretaría de Extensión Universitaria</div></div></div>${logged?`<div class="user"><span class="avatar">SE</span><span class="muted">Persona SEU<br>Permisos de demostración</span>${btn('Salir','logout','compact-button')}</div>`:''}</header>`}
function switcher(){return `<nav class="switcher" aria-label="Variantes del prototipo">${btn('←','prev')}<div><small>COMPARAR INTERFACES · ${['A','B','C'].indexOf(variant)+1}/3</small><strong>${variant} · ${names[variant]}</strong></div>${btn('→','next')}</nav>`}
function state(){const e=entry();return `<details class="state"><summary>Estado de la demostración y procedencia</summary><p>Todo el estado vive en memoria. Las decisiones, identidades y revisiones son simuladas; no hay auditoría institucional.</p><pre>${esc(JSON.stringify({variante:variant,vista:view,sesion:logged?'simulada':'sin iniciar',pedido:e?`DEMO-${e.id}`:null,estado:e?.status,tipo:e?.sample,actividad:e&&sample(e.sample).requiere_actividad?'SYN-001':null,area:e?.area,indicaciones:e?.notes,revision_visible:e?.viewed,revision_vigente:e?.current,revisiones:e?.revisions.map(({id,origin,basedOn})=>({id,origen:origin,basada_en:basedOn})),edicion_abierta:!!editing,decision:e?.decision,eventos:e?.events,fuente:e&&sample(e.sample).source,sha256_fuente:e&&sample(e.sample).sha256,version_agente:'sin ejecución de agente; snapshots golden/formas'},null,2))}</pre></details>`}
function inbox(){return `<aside class="inbox"><div class="row between" style="margin-bottom:15px"><h2 style="margin:0">Bandeja compartida</h2><span class="badge gray">${entries.length}</span></div><p class="muted">Podés continuar el trabajo de otra persona del equipo.</p><div class="inbox-list">${entries.map(e=>`<button class="item ${e.id===selected?'active':''}" data-open="${e.id}">${badge(e)}<strong>${esc(e.title)}</strong><small>DEMO-${e.id} · r${e.current}<br>${esc(e.owner)}</small></button>`).join('')}</div></aside>`}
function formView(){const s=sample(form.type);return `<section class="panel form"><div class="eyebrow muted">FIE INFORMA / NUEVO PEDIDO</div><h2>Prepará una gacetilla</h2><p class="muted">Datos precargados desde una muestra del repositorio. El catálogo y las áreas son provisionales.</p><form id="request"><label for="type">Tipo de gacetilla</label><select id="type" name="type">${SAMPLES.map(t=>`<option value="${t.id}" ${s.id===t.id?'selected':''}>${esc(t.nombre)}</option>`).join('')}</select>${s.requiere_actividad?`<label for="activity">Actividad</label><select id="activity" required><option>SYN-001 · Taller sintético de vinculación</option></select><div class="summary">Actividad de prueba, con fechas históricas de agosto de 2026. Sus datos provienen de <code>data/actividades_sinteticas.csv</code>; A1 no modifica la actividad.</div>`:`<div class="summary">Este tipo no requiere una actividad. En esta demostración se usa el caso precargado «${esc(s.title)}».</div>`}<label for="area">Área emisora</label><select id="area" name="area">${AREAS.map(a=>`<option ${a.nombre===form.area?'selected':''}>${esc(a.nombre)}</option>`).join('')}</select><label for="sample-title">Asunto de la muestra</label><input id="sample-title" readonly value="${esc(s.title)}"><label for="notes">Indicaciones adicionales <span class="muted">(opcional)</span></label><textarea id="notes" name="notes" placeholder="Por ejemplo: priorizar una introducción breve.">${esc(form.notes)}</textarea><p class="muted">La demo conserva las indicaciones para revisar el formulario. La preparación carga un texto fijo: no interpreta estas indicaciones ni ejecuta un LLM.</p><div class="foot row">${btn('Preparar borrador de muestra','create','primary')}${btn('Cancelar','inbox')}</div></form></section>`}
function review(){const e=entry(),r=rev(e),old=r.id!==e.current,closed=!!e.decision;return `<section><div class="review-header"><div class="row between"><span class="eyebrow muted">DEMO-${e.id} / FIE INFORMA</span>${badge(e)}</div><h2 style="margin-top:12px">${esc(e.title)}</h2><div class="muted">${esc(e.area)} · ${esc(e.owner)}</div><div class="row revision-info"><label for="revision">Revisión</label><select id="revision" style="width:auto;max-width:100%">${e.revisions.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>r${x.id} · ${esc(x.origin)}${x.id===e.current?' · vigente':''}</option>`).join('')}</select></div></div>${old?'<div class="hint">Estás viendo una revisión anterior. Para corregir o decidir, volvé a la revisión vigente.</div>':''}${editing?'<div class="hint">Edición externa simulada en curso. Al guardar y volver se incorpora una revisión nueva antes de decidir.</div>':''}${closed?`<div class="result"><strong>${esc(e.status)} · r${e.decision.revision}</strong><div>El recorrido de esta pieza terminó en A1. La decisión no acredita publicación.</div><small>Decisión de demostración · ${esc(e.decision.when)} · ${esc(e.decision.signal)}</small></div>`:''}<div class="review-layout"><article class="document"><div class="doc-label"><span>FIE INFORMA</span><span>r${r.id}</span></div><p class="muted">${closed?'Pieza de muestra · decisión simulada':'BORRADOR — NO PUBLICAR · Muestra'}</p><pre>${esc(r.text)}</pre></article><div class="actions"><section class="action-group"><h3>1. Corregí el contenido</h3><p class="muted">Editá el texto en una pestaña aparte. Al volver, revisá la nueva captura.</p>${btn('Editar en Docs ↗ (simulado)','edit','',old||closed||!!editing)}<p class="muted" style="margin-top:10px">El editor es una simulación local; no abre Google Docs.</p></section><section class="action-group"><h3>2. Pedí un ajuste</h3><p class="muted">Parte de la última revisión, incluidas tus correcciones. Conserva las anteriores.</p>${btn('Pedir ajuste al agente','adjust','',old||closed||!!editing)}<small style="display:block;margin-top:8px">Transformación de muestra; sin LLM.</small></section><section class="action-group"><h3>3. Decidí sobre r${r.id}</h3><p class="muted">La aprobación cierra el recorrido en A1.</p><div class="row">${btn('Aprobar borrador','approve','primary',old||closed||!!editing)}${btn('Descartar','discard','danger',old||closed||!!editing)}</div></section></div></div></section>`}
function steps(){return `<ol class="stepper">${['Bandeja','Pedido','Revisión','Decisión'].map((s,i)=>`<li class="${(view==='inbox'?0:view==='new'?1:entry()?.decision?3:2)===i?'current':''}">${i+1}. ${s}</li>`).join('')}</ol>`}
function render(){document.body.className='variant-'+variant;let body;if(!logged)body=`<main class="login"><section class="panel"><div class="eyebrow muted">A1 / COMUNICACIÓN INSTITUCIONAL</div><h1 style="margin-top:16px">Del pedido al borrador, en un mismo lugar.</h1><p class="muted">Prepará gacetillas, continuá pedidos del equipo y revisá cada pieza antes de aprobarla.</p>${btn('Ingresar con Google · simulado','login','primary')}<small>Usamos una identidad de muestra. Este botón no verifica cuentas ni permisos.</small></section></main>`;else {body=`<main class="workspace"><div class="page-heading row between"><div><div class="eyebrow muted">ESPACIO DE TRABAJO SEU</div><h1 style="margin-top:7px">Gacetillas</h1></div><div class="row">${view!=='inbox'?btn('← Bandeja','inbox'):''}${btn('+ Nuevo pedido','new','primary')}</div></div>${message?`<div class="toast" role="status">${esc(message)}</div>`:''}${variant==='B'?steps():''}${busy?'<section class="panel"><h2>Preparando la muestra…</h2><p>El pedido está en la bandeja. Esta espera es simulada.</p><div class="progress"></div></section>':view==='new'?formView():variant==='A'?`<div class="columns">${inbox()}${view==='review'?review():'<section class="panel"><h2>Elegí una pieza para continuar</h2><p class="muted">O creá un nuevo pedido con los datos precargados.</p></section>'}</div>`:view==='review'?review():inbox()}${state()}</main>`}document.getElementById('app').innerHTML=header()+body+switcher();}
function modal(html){const m=document.getElementById('modal');m.innerHTML=html;m.showModal()}
function closeModal(){document.getElementById('modal').close()}
function switchVariant(delta){const keys=['A','B','C'];variant=keys[(keys.indexOf(variant)+delta+3)%3];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
function freshRevision(e,text,origin){const base=e.current;e.current++;e.viewed=e.current;e.revisions.push({id:e.current,text,origin,basedOn:base});e.events.push({action:'revision_creada',revision:e.current,basedOn:base});}
function action(a){if(a==='prev'||a==='next'){switchVariant(a==='next'?1:-1);return}if(a==='about'){modal(`<h2>Alcance de esta demostración</h2><div class="scroll"><p>La pregunta es qué disposición facilita pedir, corregir y decidir sin perder contexto. A, B y C comparten contenido y estado.</p><p>Se simulan identidad Google, padrón, permisos, generación, espera, Google Docs, revisiones y decisiones. No hay conexión a servicios institucionales, persistencia, recuperación ni ejecución del agente.</p><p>Las siete muestras son snapshots de <code>Implementacion/Agente1/golden/formas/</code>. Son casos de prueba de las formas declaradas, no publicaciones vigentes ni piezas aprobadas por la SEU. Difusión usa la actividad sintética SYN-001. Las fechas de las muestras son históricas.</p><p>Tipos y áreas proceden de <code>tipos_gacetilla_v1.json</code> y <code>areas_emisoras_v1.json</code>, ambos provisionales. La firma de área se adapta a la selección. Las indicaciones libres se conservan, pero no se interpretan.</p><p>Todo vive en memoria y se pierde al recargar. El panel de estado muestra fuente, hash, revisiones y señales de la demostración. La prueba guiada SEU y la conformidad del contenido se registran por separado.</p></div>${btn('Volver','close')}`);return}if(a==='close'){closeModal();return}if(a==='login'){logged=true;view='inbox'}if(a==='logout'){if(editing){message='Terminá la edición de muestra antes de salir.';render();return}logged=false}if(a==='new'){view='new';message=''}if(a==='inbox'){view='inbox';message=''}if(a==='create'){create();return}if(a==='edit'){openEditor();return}if(a==='adjust'){adjust();return}if(a==='apply-adjust'){applyAdjust();return}if(a==='approve'||a==='discard'){decide(a);return}if(a==='confirm-decision'){confirmDecision();return}render()}
function create(){if(busy)return;const f=document.getElementById('request');if(!f.reportValidity())return;form.notes=document.getElementById('notes').value;form.area=document.getElementById('area').value;const s=sample(form.type),e=makeEntry(sequence++,s,'Vos · persona de muestra');e.area=form.area;e.notes=form.notes;e.revisions[0].text=e.revisions[0].text.replace('\n'+s.area+'\n','\n'+e.area+'\n');e.status='Preparando muestra';entries.unshift(e);selected=e.id;busy=true;view='review';render();setTimeout(()=>{busy=false;e.status='Pendiente de revisión';message='Muestra preparada. Revisá el contenido antes de decidir.';render()},900)}
function canChange(){const e=entry();return logged&&e&&!e.decision&&e.viewed===e.current&&!editing&&!busy}
function adjust(){if(!canChange())return;const e=entry();modal(`<h2>Ajustar desde r${e.current}</h2><p>El ajuste usa el texto vigente, incluidas las ediciones humanas, y crea otra revisión.</p><label class="field-label" for="adjustment">Cambio a ensayar</label><select id="adjustment"><option value="paragraphs">Separar los párrafos para facilitar la lectura</option>${e.sample==='difusion_de_actividad'?'<option value="shorten">Acortar la apertura de la muestra</option>':''}</select><p class="muted" style="margin-top:14px">Son transformaciones locales predefinidas para probar el recorrido. No se interpreta un pedido libre.</p><div class="row" style="margin-top:20px">${btn('Crear nueva revisión','apply-adjust','primary')}${btn('Cancelar','close')}</div>`)}
function applyAdjust(){if(!canChange())return;const e=entry(),old=latest(e).text,choice=document.getElementById('adjustment').value;let text=choice==='paragraphs'?old.replace(/\n\n/g,'\n\n\n'):old.replace('Taller de práctica para acercar la ingeniería a la comunidad con propuestas de extensión abiertas.','Taller de vinculación con la comunidad.');if(text===old){closeModal();message='La apertura fue modificada: esta transformación de muestra no aplica. Tus cambios se conservaron.';render();return}freshRevision(e,text,'Ajuste simulado');closeModal();message=`r${e.current} creada desde r${e.current-1}. Las revisiones anteriores se conservaron.`;render()}
let pendingDecision=null;
function decide(kind){if(!canChange())return;const e=entry();pendingDecision={kind,entry:e.id,revision:e.current,text:latest(e).text};modal(`<h2>${kind==='approve'?'Aprobar el borrador':'Descartar la pieza'} · r${e.current}</h2><p>La decisión quedará vinculada al contenido de esta revisión.</p><p class="muted">Simulación local. La aprobación cierra el recorrido sin publicar ni aportar automáticamente a Historia Viva.</p><label class="field-label" for="reason">Comentario (opcional)</label><textarea id="reason" placeholder="Si querés, dejá una observación."></textarea><div class="row" style="margin-top:20px">${btn(kind==='approve'?'Confirmar aprobación':'Confirmar descarte','confirm-decision',kind==='approve'?'primary':'danger')}${btn('Volver a revisar','close')}</div>`)}
function confirmDecision(){const d=pendingDecision,e=entry();if(!d||!canChange()||d.entry!==e.id||d.revision!==e.current||d.text!==latest(e).text){closeModal();message='La revisión cambió. Actualizá el contenido antes de decidir.';render();return}e.status=d.kind==='approve'?'Borrador aprobado':'Descartado';const human=e.revisions.some(r=>r.origin==='Edición humana simulada');e.decision={kind:d.kind,revision:e.current,when:new Date().toLocaleString('es-AR'),identity:'Persona SEU de muestra',comment:document.getElementById('reason').value,signal:human?'Con intervención humana':e.revisions.length>1?'Con ajuste simulado':'Sin cambios de la muestra',publicado:false};e.events.push({action:d.kind,revision:e.current});pendingDecision=null;closeModal();message='Decisión simulada registrada sobre la revisión visible.';render()}
function openEditor(){if(!canChange())return;const e=entry();const url=new URL(location);url.searchParams.set('editor','1');editorWindow=window.open(url,'_blank');if(!editorWindow){message='El navegador bloqueó la pestaña. Habilitá ventanas emergentes para ensayar la edición.';render();return}editing={entry:e.id,base:e.current,text:latest(e).text};message='Se abrió el editor de muestra en otra pestaña.';render()}
window.addEventListener('message',event=>{if(!editing||event.source!==editorWindow)return;const d=event.data;if(d?.kind==='editor-ready'){editorWindow.postMessage({kind:'editor-content',text:editing.text,base:editing.base},'*')}if(d?.kind==='editor-save'&&typeof d.text==='string'){const e=entries.find(x=>x.id===editing.entry);if(e.current!==editing.base||e.decision){message='Conflicto de revisión. La captura no se incorporó.'}else if(d.text!==editing.text){freshRevision(e,d.text,'Edición humana simulada');message=`Cambios incorporados como r${e.current}. Revisá esta captura antes de decidir.`}else{message='Se recuperó la captura; el texto no cambió.'}editing=null;editorWindow=null;render()}});
window.addEventListener('focus',()=>{if(editing&&editorWindow?.closed){editing=null;editorWindow=null;message='La pestaña se cerró sin guardar cambios. Se conserva la revisión anterior.';render()}});
document.addEventListener('click',event=>{const el=event.target.closest('[data-action],[data-open]');if(!el)return;if(el.tagName==='BUTTON')event.preventDefault();if(el.dataset.open){selected=Number(el.dataset.open);view='review';message='';render()}else action(el.dataset.action)});
document.addEventListener('change',event=>{if(event.target.id==='type'){form.notes=document.getElementById('notes').value;form.type=event.target.value;form.area=sample(form.type).area;render()}if(event.target.id==='area')form.area=event.target.value;if(event.target.id==='revision'){entry().viewed=Number(event.target.value);render()}});
document.addEventListener('input',event=>{if(event.target.id==='notes')form.notes=event.target.value});
document.addEventListener('submit',event=>{if(event.target.id==='request'){event.preventDefault();create()}});
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable="true"]')||document.getElementById('modal').open)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();switchVariant(event.key==='ArrowLeft'?-1:1)}});
if(params.get('editor')==='1'){
 document.body.className='';document.getElementById('app').innerHTML=`<div class="notice">EDITOR EXTERNO SIMULADO · No es Google Docs · Sin conexión ni persistencia</div><main class="editor"><div class="row between"><div><h1>Edición de la gacetilla</h1><p class="muted">Modificá la muestra. Guardar devuelve el texto a A1 como una revisión nueva.</p></div><button id="save-editor" class="primary" disabled>Guardar y volver a A1</button></div><label class="field-label" for="editor-text">Contenido de muestra</label><textarea id="editor-text" disabled></textarea></main>`;
 window.addEventListener('message',event=>{if(event.source!==window.opener||event.data?.kind!=='editor-content')return;document.getElementById('editor-text').value=event.data.text;document.getElementById('editor-text').disabled=false;document.getElementById('save-editor').disabled=false});
 document.getElementById('save-editor').onclick=()=>{if(!window.opener)return;window.opener.postMessage({kind:'editor-save',text:document.getElementById('editor-text').value},'*');window.opener.focus();window.close()};
 if(window.opener)window.opener.postMessage({kind:'editor-ready'},'*');
}else render();
</script></body></html>
